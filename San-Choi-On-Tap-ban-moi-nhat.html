function openScanner({cls, eligible, valid, title, onProgress}){
  return new Promise(resolve=>{
    const elig=new Set(eligible), answers=new Map(), manual=new Set();
    const ov=h(`<div class="scan"><div class="scan-main"><div class="scan-view"><canvas></canvas><div class="ph">📷 <b>Quét thẻ trả lời</b><br>Học sinh giơ thẻ lên, chữ cái đáp án mình chọn nằm ở <b>cạnh trên</b> của thẻ.<br>Bấm <b>Bật camera</b> rồi lia chậm quanh lớp, hoặc <b>Chụp / chọn ảnh</b> cả lớp (có thể chọn nhiều ảnh).</div></div>
      <div class="row"><button class="st green" data-cam>🎥 Bật camera</button><button class="st" data-photo>🖼 Chụp / chọn ảnh</button><select data-dev class="hidden" style="width:auto;max-width:220px"></select><input type="file" accept="image/*" multiple class="hidden"><span class="grow"></span><span data-msg style="opacity:.85;font-size:14px"></span></div></div>
      <div class="scan-side"><div class="cnt">📷 ${esc(title)}</div><div>Đã nhận <b data-c style="font-size:24px;color:var(--gold)">0</b>/${eligible.length} thẻ</div>
        ${phoneLinkAvailable()?'<div class="row" style="gap:8px"><span data-phonestat style="font-size:14px;font-weight:600"></span><button class="sm" data-pair style="background:rgba(255,255,255,.15);color:#fff">Mã kết nối</button></div>':''}
        <div class="chips"></div><div style="font-size:12px;opacity:.6">Chạm vào tên để tự chọn đáp án cho học sinh (nếu thẻ khó quét)</div>
        <div class="row"><button class="st" data-cancel>Hủy</button>${phoneLinkAvailable()?'<button class="st" data-mini>⤵ Thu nhỏ</button>':''}<span class="grow"></span><button class="st gold" data-done>Xong ✓</button></div></div></div>`);
    // compact bar at the bottom: the question and options stay visible while the phone scans
    const dock=h(`<div class="scandock"><span class="sd-dot"></span><b>📷 Đang quét đáp án · ${esc(title)}</b><span>Đã nhận <b data-dc style="color:var(--gold);font-size:22px">0</b>/${eligible.length}</span>
      ${phoneLinkAvailable()?'<span data-phonestat style="font-size:14px;font-weight:600"></span><button class="st" data-dpair>📱 Mã QR</button>':''}<span class="grow"></span>
      <button class="st" data-dcam>🎥 Camera máy tính</button><button class="st" data-dphoto>🖼 Ảnh</button><button class="st" data-dcancel>Hủy</button><button class="st gold" data-ddone>Xong ✓</button></div>`);
    const qf=h(`<div class="qrfloat dqr hidden" ${phoneLinkAvailable()?'data-qrslot data-qrsize="120"':''}></div>`);
    $('#stage').appendChild(ov); $('#stage').appendChild(dock); $('#stage').appendChild(qf);
    const showFull=full=>{ ov.classList.toggle('hidden',!full); dock.classList.toggle('hidden',full); qf.style.display=full?'none':''; $('#stage').classList.toggle('side-scan',full); };
    showFull(!phoneLinkAvailable());
    const cv=ov.querySelector('canvas');
    const qid=uid();
    const sendReq=()=>{ if(R.nr) R.nr.emit('scan.req',{qid, title:String(title), valid, got:answers.size, students:eligible.map(i=>[i, shortName(cls.students[i]).slice(0,24)])}).catch(()=>{}); };
    if(phoneLinkAvailable()){
      ensurePair().then(()=>{ sendReq(); updatePairUI(); }).catch(()=>{});
      R.onJoin=sendReq;
      R.onDone=()=>finish(answers);
      R.onRes=d=>{ if(!d||d.qid!==qid||!Array.isArray(d.answers)) return; let fresh=0;
        for(const pr of d.answers.slice(0,200)){ if(!Array.isArray(pr)) continue; const i=pr[0], a=pr[1];
          if(Number.isInteger(i)&&Number.isInteger(a)&&a>=0&&a<4&&elig.has(i)){ if(!answers.has(i)) fresh++; answers.set(i,a); } }
        if(fresh) sfx.tick(); drawChips(); sendReq(); const ph=ov.querySelector('.ph'); if(ph) ph.innerHTML='📱 Đang nhận kết quả từ điện thoại…'; msg(`📱 Điện thoại gửi ${d.answers.length} thẻ`); };
    }
    const reqTimer=setInterval(sendReq, 4000);
    const fi=ov.querySelector('input[type=file]'), msgEl=ov.querySelector('[data-msg]');
    let stream=null, vid=null, raf=0, last=0;
    const msg=t=>{ msgEl.textContent=t; };
    function drawChips(){
      const dc=dock.querySelector('[data-dc]'); if(dc) dc.textContent=answers.size;
      if(onProgress) try{ onProgress(answers); }catch(e){}
      ov.querySelector('.chips').innerHTML=eligible.map(i=>{ const a=answers.get(i);
        return `<div class="chip ${a!=null?'got':''}" data-i="${i}" title="${esc(cls.students[i])}"><i>${i+1}</i><span>${esc(shortName(cls.students[i]))}</span>${a!=null?`<span class="bd">${manual.has(i)?LETTERS[a]:'✓'}</span>`:''}</div>`; }).join('');
      ov.querySelector('[data-c]').textContent=answers.size;
    }
    ov.querySelector('.chips').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; const i=+c.dataset.i, cur=answers.get(i);
      let nx; if(cur==null) nx=valid[0]; else { const k=valid.indexOf(cur); nx=(k<0||k===valid.length-1)?null:valid[k+1]; }
      manual.add(i); if(nx==null) answers.delete(i); else answers.set(i,nx); drawChips(); };
    function processFrame(src, sw, sh, maxSide){
      const found=scanImage(src, sw, sh, maxSide, cv, id=>id<cls.students.length&&elig.has(id), id=>id<cls.students.length);
      let fresh=0;
      for(const mk of found){ if(mk.id<cls.students.length&&elig.has(mk.id)){ if(!answers.has(mk.id)) fresh++; answers.set(mk.id, mk.ans); } }
      if(fresh){ sfx.tick(); }
      drawChips(); sendReq(); const ph=ov.querySelector('.ph'); if(ph) ph.remove();
      return found.length;
    }
    async function startCam(devId){
      stopCam(); msg('Đang mở camera…');
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no');
        const size={width:{ideal:1920},height:{ideal:1080}};
        stream=await navigator.mediaDevices.getUserMedia({audio:false, video: devId?{deviceId:{exact:devId},...size}:{facingMode:{ideal:'environment'},...size}});
        vid=document.createElement('video'); vid.playsInline=true; vid.muted=true; vid.srcObject=stream; await vid.play();
        ov.querySelector('[data-cam]').textContent='⏹ Tắt camera'; msg('Lia camera chậm quanh lớp…');
        try{ const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); const sel=ov.querySelector('[data-dev]');
          if(devs.length>1){ sel.innerHTML=devs.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||('Camera '+(i+1)))}</option>`).join(''); const cur=stream.getVideoTracks()[0].getSettings().deviceId; if(cur) sel.value=cur; sel.classList.remove('hidden'); } }catch(_){}
        const loop=t=>{ raf=requestAnimationFrame(loop); if(!vid||vid.readyState<2||t-last<200) return; last=t; processFrame(vid, vid.videoWidth, vid.videoHeight, 1280); };
        raf=requestAnimationFrame(loop);
      }catch(e){ stopCam(); msg('Không mở được camera ở đây — hãy dùng “Chụp / chọn ảnh”'+(location.protocol==='file:'?'.':', hoặc mở bản tải về máy.')); }
    }
    function stopCam(){ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } vid=null; ov.querySelector('[data-cam]').textContent='🎥 Bật camera'; }
    const loadImage=loadImageFile;
    ov.querySelector('[data-cam]').onclick=()=>{ stream?stopCam():startCam(); };
    dock.querySelector('[data-dcam]').onclick=()=>{ showFull(true); startCam(); };
    dock.querySelector('[data-dphoto]').onclick=()=>{ showFull(true); stopCam(); fi.value=''; fi.click(); };
    dock.querySelector('[data-dcancel]').onclick=()=>finish(null);
    dock.querySelector('[data-ddone]').onclick=()=>finish(answers);
    const dp=dock.querySelector('[data-dpair]'); if(dp) dp.onclick=openPairing;
    const mini=ov.querySelector('[data-mini]'); if(mini) mini.onclick=()=>{ stopCam(); showFull(false); };
    ov.querySelector('[data-dev]').onchange=e=>startCam(e.target.value);
    ov.querySelector('[data-photo]').onclick=()=>{ stopCam(); fi.value=''; fi.click(); };
    fi.onchange=async()=>{
      let total=0, n=0;
      for(const f of fi.files){ try{ msg('Đang đọc ảnh…'); const im=await loadImage(f); total+=processFrame(im, im.width, im.height, 2400); n++; }catch(e){ msg('Không đọc được ảnh'); } }
      if(n) msg(`Đã đọc ${n} ảnh, nhận ${total} thẻ. Có thể chụp thêm ảnh khác.`);
    };
    const finish=val=>{ if(!ov.isConnected) return; stopCam(); clearInterval(reqTimer); R.onJoin=null; R.onRes=null; R.onDone=null; sendIdle(''); ov.remove(); dock.remove(); qf.remove(); const stg=$('#stage'); if(stg) stg.classList.remove('side-scan'); resolve(val); };
    ov.querySelector('[data-cancel]').onclick=()=>finish(null);
    const pb=ov.querySelector('[data-pair]'); if(pb) pb.onclick=openPairing;
    ov.querySelector('[data-done]').onclick=()=>finish(answers);
    drawChips();
  });
}

/* ===== Phone link: phone side ===== */
function openPhoneMode(){
  if(!phoneLinkAvailable()){ toast('Chức năng này chỉ dùng được trên link claude.ai'); return; }
  const m=modal(`<h3>📱 Điện thoại chụp đáp án</h3><p class="muted">Trên máy tính đang chiếu trò chơi, bấm nút <b>📱 Điện thoại</b> ở thanh trên cùng của trò chơi để xem mã kết nối 4 số.</p>
    <label class="f">Mã kết nối</label><input data-code inputmode="numeric" maxlength="4" placeholder="VD: 4821" style="font-size:28px;letter-spacing:8px;text-align:center;font-weight:800">
    <div class="foot"><button data-c>Hủy</button><button class="primary" data-go>Kết nối</button></div>`);
  const inp=m.querySelector('[data-code]'); setTimeout(()=>inp.focus(),50);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  const go=async()=>{ const code=inp.value.replace(/\D/g,''); if(code.length!==4){ toast('Mã gồm 4 chữ số'); return; }
    m.querySelector('[data-go]').disabled=true;
    if(await phoneJoin(code)) m.remove(); else m.querySelector('[data-go]').disabled=false; };
  m.querySelector('[data-go]').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
}
async function phoneJoin(code){
  try{ const nr=await S.room.join('quet-'+code); try{ localStorage.setItem('scot_phone_code',code); }catch(e){} if($('#phone')) $('#phone').remove(); phoneUI(nr, code); return true; }
  catch(e){ toast('Không kết nối được, thử lại'); return false; }
}
// opened from the QR code: #pair-1234
const PAIR_FROM_URL=(String(location.hash).match(/^#pair-(\d{4})$/)||[])[1]||'';
function pairFromUrl(){
  if(!PAIR_FROM_URL || pairFromUrl.done) return; pairFromUrl.done=true;
  if(phoneLinkAvailable()) phoneJoin(PAIR_FROM_URL);
  else toast('Không kết nối được: hãy mở link bằng trình duyệt đã đăng nhập Claude');
}
function phoneUI(nr, code){
  let req=null, answers=new Map(), note='', screens=0, lastCanvas=null, lastMsg='';
  const el=h(`<div id="phone"></div>`); document.body.appendChild(el);
  const credit=`<div class="credit" style="margin-top:auto">${CREDIT}</div>`;
  const mine=m=>m && m.isMe && !m.sameTab;
  const send=()=>{ if(req) nr.emit('scan.res',{qid:req.qid, answers:[...answers]}).catch(()=>toast('Gửi chưa được, thử lại')); };
  const stat=()=>screens?'<span style="color:#2ee66b">● Đã nối máy chiếu</span>':'<span style="color:#ffb3b3">● Chưa thấy máy chiếu</span>';
  nr.presence({role:'phone'}).catch(()=>{});
  let pDrop=null, pDown=false;
  try{ nr.onConnection(ok=>{ clearTimeout(pDrop);
    if(!ok) pDrop=setTimeout(()=>{ pDown=true; const st=el.querySelector('[data-st]'); if(st) st.innerHTML='<span style="color:#ffb3b3">📡 Mất mạng — đang nối lại…</span>'; },2500);
    else if(pDown){ pDown=false; const st=el.querySelector('[data-st]'); if(st) st.innerHTML=stat(); nr.emit('phone.hello',{}).catch(()=>{}); if(req) send(); } },
    ()=>{ el.remove(); toast('Mất kết nối — đang nối lại…'); setTimeout(()=>phoneJoin(code), 1500); }); }catch(e){}
  nr.on('scan.req', mm=>{ if(!mine(mm)) return; const d=mm.data||{};
    if(typeof d.qid!=='string'||!Array.isArray(d.students)) return;
    const isNew=!req||req.qid!==d.qid;
    if(isNew){ answers=new Map(); lastCanvas=null; lastMsg=''; }

      : `<div class="ph-big">📷 ${esc(req.title)}</div><div>Máy chiếu đã nhận <b data-got style="color:var(--gold);font-size:22px">${req.got}</b>/${req.students.length} thẻ</div>
        <label class="shot">📸 Chụp ảnh lớp<input type="file" accept="image/*" capture="environment"></label>
        <label style="text-align:center;border-radius:10px;padding:10px;background:rgba(255,255,255,.14);cursor:pointer;font-weight:600">🖼 Chọn ảnh có sẵn<input type="file" accept="image/*" multiple style="display:none"></label>
        <div data-cv></div><div data-msg style="opacity:.85;font-size:14px">${esc(lastMsg)}</div>
        <div class="chips">${req.students.map(([i,n])=>{ const a=answers.get(i); return `<div class="chip ${a!=null?'got':''}"><i>${i+1}</i><span>${esc(n)}</span>${a!=null?`<span class="bd">${LETTERS[a]}</span>`:''}</div>`; }).join('')}</div>
        <button class="st gold" data-done style="font-size:20px;padding:16px">✓ Xong — xem kết quả trên máy chiếu</button>`)+credit;
    const cvBox=el.querySelector('[data-cv]'); if(lastCanvas && cvBox) cvBox.appendChild(lastCanvas);
    el.querySelector('[data-exit]').onclick=()=>{ nr.presence({role:null}).catch(()=>{}); nr.leave().catch(()=>{}); el.remove(); };
    const ob=el.querySelector('[data-open]'); if(ob) ob.onclick=()=>{ nr.emit('scan.open',{}).catch(()=>toast('Chưa gửi được')); note='Đã gửi yêu cầu, chờ máy chiếu…'; draw(); };
    const db=el.querySelector('[data-done]'); if(db) db.onclick=()=>{ send(); setTimeout(()=>nr.emit('scan.done',{}).catch(()=>{}),300); toast('Đã gửi — xem kết quả trên máy chiếu'); };
    el.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{
      if(!req) return; const set=new Set(req.students.map(x=>x[0]));
      const cv=document.createElement('canvas'); cv.dataset.private='1'; const msgEl=el.querySelector('[data-msg]'); let total=0, n=0;
      for(const f of inp.files){ try{ msgEl.textContent='Đang nhận diện…'; const im=await loadImageFile(f);
        const found=scanImage(im, im.width, im.height, 2400, cv, id=>set.has(id), ()=>true);
        found.forEach(mk=>{ if(set.has(mk.id)) answers.set(mk.id, mk.ans); }); total+=found.filter(mk=>set.has(mk.id)).length; n++; }catch(e){ msgEl.textContent='Không đọc được ảnh'; } }
      if(!n) return;
      send(); sfx.tick();
      lastCanvas=cv; lastMsg=`Ảnh vừa chụp: nhận ${total} thẻ, đã gửi lên máy chiếu (${answers.size} thẻ tổng cộng). Chụp thêm góc khác nếu còn thiếu.`;
      draw();
    });
  }
  draw();
}

function parseNames(text){
  return String(text||'').replace(/\r/g,'').split('\n').map(line=>{
    line=line.replace(/^\s*\d+\s*[\.\)\-:]?\s*/,'');
    const raw=line.split('\t').map(s=>s.trim()).filter(Boolean);
    if(raw.some(c=>/^(stt|tt|số tt|họ và tên|họ tên|họ và tên đệm|họ đệm|họ và đệm|tên|họ|ngày sinh|giới tính|ghi chú)$/i.test(c))) return '';
    const cells=raw.filter(s=>/\p{L}/u.test(s) && !/\d/.test(s));
    return cells.join(' ').replace(/\s+/g,' ').trim();
  }).filter(n=>n && !/^(stt|tên|họ)$/i.test(n) && !/^họ\s*(và)?\s*tên/i.test(n));
}

/* ================= Game: Wheel ================= */
function gameWheel(root, set, opt){
  const qs=set.questions; let mode=opt.wheel;
  let items=[], angle=0, spinning=false, raf=null, unkey=()=>{}, qv=null;
  let names=''; if(opt.cls) names=opt.cls.students.join('\n'); else { try{ names=localStorage.getItem('scot_names')||''; }catch(e){} }
  const COLORS=['#d64545','#2b59c3','#d98b00','#1f9d55','#8e44ad','#16a085','#e67e22','#3d6fe0'];
  function resetItems(){ items = mode==='q' ? qs.map((q,i)=>({label:String(i+1), q})) : names.split('\n').map(s=>s.trim()).filter(Boolean).map(n=>({label:n})); }
  resetItems();
  root.innerHTML=`<div class="wheel-layout"><div class="wheel-box"><canvas width="900" height="900"></canvas><div class="pin"></div><div class="hub">QUAY</div></div>
    <div class="wheel-side">
      <div class="row"><button class="st ${mode==='q'?'gold':''}" data-m="q">Câu hỏi</button><button class="st ${mode==='n'?'gold':''}" data-m="n">Tên học sinh</button></div>
      <div data-namebox class="${mode==='n'?'':'hidden'}"><div style="font-size:14px;opacity:.85;margin-bottom:6px">Danh sách học sinh (mỗi dòng một tên):</div><textarea data-names placeholder="Nguyễn Văn An&#10;Trần Thị Bình&#10;...">${esc(names)}</textarea></div>
      <div data-info style="font-size:15px;opacity:.9"></div>
      <button class="st gold" data-spin style="font-size:20px">🎡 Quay! (Space)</button>
      <button class="st" data-reset>↺ Khôi phục vòng quay</button>
    </div></div>`;
  const cv=root.querySelector('canvas'), ctx=cv.getContext('2d');
  function draw(){
    const W=cv.width, R=W/2-10, cx=W/2, cy=W/2; ctx.clearRect(0,0,W,W);
    if(!items.length){ ctx.fillStyle='rgba(255,255,255,.15)'; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 40px Be Vietnam Pro'; ctx.textAlign='center'; ctx.fillText(mode==='q'?'Đã hết câu hỏi':'Nhập tên học sinh',cx,cy+R*.55); return; }
    const n=items.length, seg=2*Math.PI/n;
    items.forEach((it,i)=>{
      const a0=angle+i*seg; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a0+seg); ctx.closePath();
      ctx.fillStyle=COLORS[(i%COLORS.length + (n%COLORS.length===1&&i===n-1?1:0))%COLORS.length]; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0+seg/2); ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle='#fff';
      const fs=Math.max(16,Math.min(64, seg*R*0.55, mode==='q'?64:46)); ctx.font=`800 ${fs}px Be Vietnam Pro`;
      let t=it.label; if(t.length>18) t=t.slice(0,17)+'…'; ctx.fillText(t, R-24, 0); ctx.restore();
    });
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.lineWidth=12; ctx.strokeStyle='#f2b705'; ctx.stroke();
  }
  function info(){ root.querySelector('[data-info]').textContent = mode==='q' ? `Còn ${items.length}/${qs.length} câu hỏi trên vòng quay` : `${items.length} học sinh trên vòng quay`; }
  function spin(){
    if(spinning||!items.length||qv) return; spinning=true; ac();
    const n=items.length, seg=2*Math.PI/n, target=Math.floor(Math.random()*n);
    // pointer at angle 0 (right side). Want segment target centered at 0.
    const want = -(target*seg+seg/2) + (Math.random()-.5)*seg*.7;
    let delta = ((want-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI) + 2*Math.PI*(5+Math.floor(Math.random()*3));
    const start=angle, dur=4200+Math.random()*1200, t0=performance.now(); let lastSeg=null;
    const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); angle=start+delta*e;
      const cur=Math.floor((((-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI))/seg); if(cur!==lastSeg){ lastSeg=cur; sfx.tick(); }
      draw(); if(p<1) raf=requestAnimationFrame(step); else { spinning=false; angle%=2*Math.PI; result(target); } };
    raf=requestAnimationFrame(step);
  }
  function result(i){
    const it=items[i]; sfx.fanfare();
    if(mode==='n'){
      const m=h(`<div class="flash" style="pointer-events:auto;animation:none;background:rgba(0,0,0,.5)"><div style="text-align:center">🎉 ${esc(it.label)}<div class="ctrl"><button class="st" data-keep style="background:rgba(0,0,0,.15);color:#3a2a00">Giữ lại</button><button class="st" data-rm style="background:rgba(0,0,0,.15);color:#3a2a00">Bỏ khỏi vòng quay</button></div></div></div>`);
      document.body.appendChild(m);
      m.querySelector('[data-keep]').onclick=()=>m.remove();
      m.querySelector('[data-rm]').onclick=()=>{ items.splice(i,1); draw(); info(); m.remove(); };
      return;
    }
    const q=it.q; items.splice(i,1);
    const ov=h(`<div style="position:absolute;inset:0;top:52px;background:radial-gradient(ellipse at top,#21408f 0%,#0f1e4a 70%);display:flex;flex-direction:column;padding:16px clamp(12px,3vw,40px);z-index:5;overflow:auto"></div>`);
    qv=questionView(q, `Câu số ${it.label}`, opt.time||qTime(q,set)); ov.appendChild(qv.el);
    const ctrl=h(`<div class="ctrl"><button class="st green" data-t>▶ Tính giờ</button><button class="st gold" data-r>Hiện đáp án</button><button class="st" data-back>🎡 Về vòng quay</button></div>`); ov.appendChild(ctrl);
    $('#stage').appendChild(ov);
    const tb=ctrl.querySelector('[data-t]');
    const toggle=()=>{ if(qv.revealed) return; if(qv.timer.running){ qv.timer.stop(); tb.textContent='▶ Tiếp tục'; } else { qv.timer.start(); tb.textContent='⏸ Dừng'; } };
    tb.onclick=toggle; const reveal=()=>{ qv.reveal(); tb.disabled=true; };
    ctrl.querySelector('[data-r]').onclick=reveal;
    const back=()=>{ qv.destroy(); qv=null; ov.remove(); draw(); info(); bindKeys(); };
    ctrl.querySelector('[data-back]').onclick=back;
    unkey(); unkey=keyHandler({' ':toggle,'Enter':()=>qv.revealed?back():reveal(),'Escape':back});
  }
  function bindKeys(){ unkey(); unkey=keyHandler({' ':spin,'Enter':spin}); }
  root.querySelector('.hub').onclick=spin; root.querySelector('[data-spin]').onclick=spin;
  root.querySelector('[data-reset]').onclick=()=>{ if(spinning) return; resetItems(); draw(); info(); };
  root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(spinning) return; mode=b.dataset.m; root.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('gold',x===b)); root.querySelector('[data-namebox]').classList.toggle('hidden',mode!=='n'); resetItems(); draw(); info(); });
  root.querySelector('[data-names]').addEventListener('input',e=>{ names=e.target.value; if(!opt.cls){ try{localStorage.setItem('scot_names',names)}catch(_){} } if(!spinning){ resetItems(); draw(); info(); } });
  draw(); info(); bindKeys();
  return ()=>{ cancelAnimationFrame(raf); unkey(); qv&&qv.destroy(); };
}

/* ================= Game: Crossword ================= */
function buildCrossword(set){
  const qs=set.questions.filter(q=>q.q.trim() && crossWord(q).length);
  const key=plain(set.keyword);
  if(!key){ return {rows:qs.map(q=>({q, word:crossWord(q), pos:-1})), key:'', keyCol:-1, warn:''}; }
  // assign one question per keyword letter (order preserved, backtracking)
  const used=new Set(), pick=[];
  function bt(i, from){
    if(i===key.length) return true;
    for(let j=0;j<qs.length;j++){
      if(used.has(j)) continue; const w=crossWord(qs[j]); const p=w.indexOf(key[i]); if(p<0) continue;
      used.add(j); pick[i]={q:qs[j], word:w, pos:p}; if(bt(i+1)) return true; used.delete(j);
    }
    return false;
  }
  // prefer keeping original order: greedy first
  let ok=true; const g=[]; let start=0;
  for(let i=0;i<key.length;i++){ let found=false; for(let j=start;j<qs.length;j++){ const w=crossWord(qs[j]); const p=w.indexOf(key[i]); if(p>=0){ g[i]={q:qs[j],word:w,pos:p}; start=j+1; found=true; break; } } if(!found){ ok=false; break; } }
  let rows;
  if(ok) rows=g; else if(qs.length<=40 && bt(0,0)) rows=pick.slice(); else rows=null;
  if(!rows){ return {rows:qs.map(q=>({q, word:crossWord(q), pos:-1})), key:'', keyCol:-1, warn:`Không ghép được từ khóa “${set.keyword}” với các đáp án hiện có — mỗi chữ cái của từ khóa cần nằm trong đáp án của một câu hỏi khác nhau.`}; }
  const keyCol=Math.max(...rows.map(r=>r.pos));
  return {rows, key, keyCol, warn:''};
}
function gameCross(root, set, opt){
  const cw=buildCrossword(set);
  if(!cw.rows.length){ root.innerHTML='<div class="center"><div class="big">Chưa có đáp án cho ô chữ</div><p>Ô chữ dùng đáp án đúng của mỗi câu (hoặc ô “Đáp án ô chữ” trong phần soạn câu hỏi).</p></div>'; return; }
  const maxLen=Math.max(...cw.rows.map(r=>(cw.keyCol>=0?cw.keyCol-r.pos:0)+r.word.length));
  const cols=maxLen+(0);
  const state=cw.rows.map(()=>({open:false, fail:false}));
  let sel=-1, keyOpen=false, unkey=()=>{}, timer=null;
  const cs=`clamp(22px, min(${(70/ (cols+2)).toFixed(2)}vw, ${(62/(cw.rows.length+2)).toFixed(2)}vh), 52px)`;
  root.innerHTML=`<div class="cw-layout" style="--cs:${cs}"><div class="cw-grid"></div><div class="cw-side">
    <div class="cw-q"><div class="h">Hướng dẫn</div>Bấm vào số thứ tự của một hàng ngang để xem câu hỏi.${cw.key?` Từ khóa hàng dọc gồm <b>${cw.key.length}</b> chữ cái.`:''}</div>
    <div class="row" data-tslot style="justify-content:center"></div>
    <div class="ctrl" style="padding:0"><button class="st green" data-t disabled>▶ Tính giờ</button><button class="st gold" data-open disabled>Mở hàng ngang</button><button class="st" data-fail disabled>✗ Trả lời sai</button></div>
    ${cw.key?`<div style="text-align:center;margin-top:8px"><div style="opacity:.8;margin-bottom:6px">${set.keywordHint?'Gợi ý: '+esc(set.keywordHint):'Từ khóa'}</div><div class="keyrow" data-keyrow></div><div class="ctrl"><button class="st gold" data-key>🔑 Mở từ khóa</button></div></div>`:''}
    ${cw.warn?`<div class="explain">${esc(cw.warn)}</div>`:''}
  </div></div>`;
  const grid=root.querySelector('.cw-grid');
  function drawGrid(){
    grid.innerHTML=cw.rows.map((r,i)=>{
      const off=cw.keyCol>=0?cw.keyCol-r.pos:0; let cells='';
      for(let c=0;c<cols;c++){
        const k=c-off;
        if(k<0||k>=r.word.length){ cells+=`<div class="cw-c blank"></div>`; continue; }
        const isKey=cw.keyCol>=0 && c===cw.keyCol;
        const show=state[i].open || (isKey && keyOpen);
        cells+=`<div class="cw-c ${isKey?'key':'box'} ${show?'':'hid'}" data-r="${i}" data-k="${k}">${r.word[k]}</div>`;
      }
      return `<div class="cw-row ${sel===i?'sel':''} ${state[i].open?'done':''} ${state[i].fail&&!state[i].open?'fail':''}"><div class="rn" data-row="${i}">${i+1}</div>${cells}</div>`;
    }).join('');
    grid.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>select(+b.dataset.row));
    const kr=root.querySelector('[data-keyrow]');
    if(kr) kr.innerHTML=cw.key.split('').map((ch,i)=>`<div class="cw-c key ${keyOpen||state[i].open?'':'hid'}" style="--cs:44px">${ch}</div>`).join('');
  }
  function select(i){
    sel=i; sfx.click(); const r=cw.rows[i];
    timer&&timer.destroy(); timer=makeTimer(opt.time||qTime(r.q,set));
    const ts=root.querySelector('[data-tslot]'); ts.innerHTML=''; ts.appendChild(timer.el);
    root.querySelector('.cw-q').innerHTML=`<div class="h">Hàng ngang số ${i+1} · ${r.word.length} chữ cái</div>${esc(r.q.q)}${r.q.type!=='short'?'<ol type="A" style="margin:8px 0 0;font-size:.9em">'+r.q.options.filter(o=>o.trim()).map(o=>`<li>${esc(o)}</li>`).join('')+'</ol>':''}`;
    ['[data-t]','[data-open]','[data-fail]'].forEach(s=>root.querySelector(s).disabled=state[i].open);
    root.querySelector('[data-t]').textContent='▶ Tính giờ';
    drawGrid();
  }
  function openRow(){
    if(sel<0||state[sel].open) return; state[sel].open=true; timer&&timer.stop(); sfx.correct(); drawGrid();
    grid.querySelectorAll(`[data-r="${sel}"]`).forEach((c,j)=>{ c.style.animationDelay=(j*60)+'ms'; c.classList.add('pop'); });
    ['[data-t]','[data-open]','[data-fail]'].forEach(s=>root.querySelector(s).disabled=true);
    if(state.every(s=>s.open) && cw.key && !keyOpen) setTimeout(()=>flash('🔑 Đoán từ khóa nào!'),700);
  }
  root.querySelector('[data-t]').onclick=e=>{ if(!timer) return; if(timer.running){timer.stop(); e.target.textContent='▶ Tiếp tục';} else {timer.start(); e.target.textContent='⏸ Dừng';} };
  root.querySelector('[data-open]').onclick=openRow;
  root.querySelector('[data-fail]').onclick=()=>{ if(sel<0) return; state[sel].fail=true; timer&&timer.stop(); sfx.wrong(); drawGrid(); };
  const kb=root.querySelector('[data-key]'); if(kb) kb.onclick=()=>{ keyOpen=true; sfx.bell(); drawGrid(); flash('🔑 '+cw.key); };
  drawGrid();
  unkey=keyHandler({'Enter':openRow,'ArrowDown':()=>select(Math.min(cw.rows.length-1,sel+1)),'ArrowUp':()=>select(Math.max(0,sel-1))});
  return ()=>{ unkey(); timer&&timer.destroy(); };
}

/* ================= Game: Flashcards ================= */
function gameFlash(root, set, opt){
  let deck=set.questions.slice(), i=0, known=new Set(), unkey=()=>{};
  function draw(){
    if(i>=deck.length){ return summary(); }
    const q=deck[i];
    root.innerHTML=`<div class="fc-wrap"><div class="progress"><i style="width:${(i/deck.length*100)}%"></i></div>
      <div style="opacity:.85">Thẻ ${i+1}/${deck.length} · Đã thuộc: ${known.size}</div>
      <div class="fc"><div class="in">
        <div class="face front"><span class="lab">Câu hỏi</span><div class="main">${esc(q.q)}</div>${q.type==='mc'?'<ol type="A">'+q.options.filter(o=>o.trim()).map(o=>`<li>${esc(o)}</li>`).join('')+'</ol>':''}<div class="sub" style="position:absolute;bottom:14px;opacity:.5">Bấm vào thẻ để lật</div></div>
        <div class="face back"><span class="lab">Đáp án</span><div class="main">${q.type==='mc'?LETTERS[q.correct]+'. ':''}${esc(correctText(q))}</div>${q.explain?`<div class="sub">💡 ${esc(q.explain)}</div>`:''}</div>
      </div></div>
      <div class="ctrl"><button class="st" data-prev>‹ Trước</button><button class="st" data-no>😕 Chưa thuộc</button><button class="st green" data-yes>✓ Đã thuộc</button><button class="st" data-next>Sau ›</button></div>
      <div style="font-size:13px;opacity:.7">Space = lật thẻ · ← → = chuyển thẻ · 1 = chưa thuộc · 2 = đã thuộc</div></div>`;
    const fc=root.querySelector('.fc'); const flip=()=>{ fc.classList.toggle('flip'); sfx.flip(); };
    fc.onclick=flip;
    root.querySelector('[data-prev]').onclick=()=>{ if(i>0){i--;draw();} };
    root.querySelector('[data-next]').onclick=()=>{ i++; draw(); };
    root.querySelector('[data-yes]').onclick=()=>{ known.add(q.id); sfx.correct(); i++; draw(); };
    root.querySelector('[data-no]').onclick=()=>{ known.delete(q.id); i++; draw(); };
    unkey(); unkey=keyHandler({' ':flip,'ArrowRight':()=>{i++;draw()},'ArrowLeft':()=>{if(i>0){i--;draw()}},'1':()=>root.querySelector('[data-no]').click(),'2':()=>root.querySelector('[data-yes]').click()});
  }
  function summary(){
    const left=set.questions.filter(q=>!known.has(q.id));
    if(!left.length) sfx.fanfare();
    root.innerHTML=`<div class="center"><div class="big">${left.length?'Cố lên!':'🎉 Thuộc hết rồi!'}</div><div style="font-size:22px">Đã thuộc ${known.size}/${set.questions.length} thẻ</div>
      <div class="ctrl">${left.length?`<button class="st gold" data-review>Ôn lại ${left.length} thẻ chưa thuộc</button>`:''}<button class="st" data-all>↺ Học lại từ đầu</button><button class="st" data-x>Về trang chính</button></div></div>`;
    const r=root.querySelector('[data-review]'); if(r) r.onclick=()=>{ deck=opt.shufQ?shuffle(left):left; i=0; draw(); };
    root.querySelector('[data-all]').onclick=()=>{ deck=opt.shufQ?shuffle(set.questions):set.questions.slice(); known.clear(); i=0; draw(); };
    root.querySelector('[data-x]').onclick=closeStage;
    unkey(); unkey=keyHandler({});
  }
  draw();
  return ()=>unkey();
}

/* ================= Game: Memory match ================= */
function gameMemory(root, set, opt){
  let unkey=()=>{}, timerIv=null;
  function start(){
    const pool=set.questions.filter(q=>correctText(q).trim());
    const chosen=shuffle(pool).slice(0,8);
    if(chosen.length<2){ root.innerHTML='<div class="center"><div class="big">Cần ít nhất 2 câu có đáp án</div></div>'; return; }
    const cards=shuffle(chosen.flatMap((q,k)=>[{k,t:q.q,ans:false},{k,t:correctText(q),ans:true}]));
    const n=cards.length, colsN=n<=8?4:n<=12?4:n<=16?4:6;
    let open=[], got=0, moves=0, lock=false; const t0=Date.now();
    root.innerHTML=`<div class="row" style="justify-content:center;gap:24px;font-size:18px;margin-bottom:10px"><span>Lượt lật: <b data-moves>0</b></span><span>Cặp đúng: <b data-got>0</b>/${chosen.length}</span><span>⏱ <b data-time>0:00</b></span><button class="st" data-new>↺ Ván mới</button></div>
      <div class="mem-grid" style="grid-template-columns:repeat(${colsN},1fr)">${cards.map((c,i)=>`<div class="mc" data-i="${i}"><div class="in"><div class="face bk">?</div><div class="face fr ${c.ans?'ans':''}">${esc(c.t.length>110?c.t.slice(0,108)+'…':c.t)}</div></div></div>`).join('')}</div>`;
    clearInterval(timerIv);
    timerIv=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); const el=root.querySelector('[data-time]'); if(el) el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
    root.querySelector('[data-new]').onclick=start;
    root.querySelectorAll('.mc').forEach(el=>el.onclick=()=>{
      if(lock||el.classList.contains('open')||el.classList.contains('got')) return;
      el.classList.add('open'); sfx.flip(); open.push(el);
      if(open.length===2){
        moves++; root.querySelector('[data-moves]').textContent=moves;
        const [a,b]=open, ca=cards[+a.dataset.i], cb=cards[+b.dataset.i];
        if(ca.k===cb.k && ca.ans!==cb.ans){
          setTimeout(()=>{ a.classList.add('got'); b.classList.add('got'); a.classList.remove('open'); b.classList.remove('open'); sfx.correct(); got++; root.querySelector('[data-got]').textContent=got;
            if(got===chosen.length){ clearInterval(timerIv); setTimeout(()=>{ sfx.fanfare(); flash(`🎉 Hoàn thành sau ${moves} lượt!`); },400); } },350);
          open=[];
        } else {
          lock=true; setTimeout(()=>{ a.classList.add('shake'); b.classList.add('shake'); sfx.wrong(); },300);
          setTimeout(()=>{ a.classList.remove('open','shake'); b.classList.remove('open','shake'); open=[]; lock=false; },1100);
        }
      }
    });
  }
  start();
  return ()=>{ clearInterval(timerIv); unkey(); };
}

/* ===== Claude API, called straight from this page with the teacher's own key (downloaded file) ===== */
const CL_API='https://api.anthropic.com/v1';
function clGet(k){ try{ return localStorage.getItem('scot_claude_'+k)||''; }catch(e){ return ''; } }
function clSet(k,v){ try{ localStorage.setItem('scot_claude_'+k, v||''); }catch(e){} }
function clHeaders(key, extra){
  return Object.assign({ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2026-10-21',
    'anthropic-dangerous-direct-browser-access':'true' }, extra||{});
}
async function clFetch(url, opts){
  let r; try{ r=await fetch(url, opts); }catch(e){ const err=new Error('network'); err.kind='network'; throw err; }
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error((data&&data.error&&data.error.message)||('HTTP '+r.status)); err.kind='http'; err.status=r.status; err.etype=data&&data.error&&data.error.type; throw err; }
  return data;
}
async function clTestKey(key){ return clFetch(`${CL_API}/models?limit=1`, { headers:clHeaders(key) }); }
// JSON shape the questions must follow (structured outputs)
const CL_SCHEMA={ type:'object', additionalProperties:false, required:['questions'], properties:{ questions:{ type:'array', items:{
  type:'object', additionalProperties:false, required:['type','q','options','correct','answer','explain'], properties:{
    type:{type:'string', enum:['mc','tf','short']}, q:{type:'string'}, options:{type:'array', items:{type:'string'}},
    correct:{type:'integer'}, answer:{type:'string'}, explain:{type:'string'} } } } } };
async function clGenerate(key, model, prompt){
  const m=model||'claude-opus-5-5';
  const body={ model:m, max_tokens:16000, messages:[{role:'user', content:prompt+'\nVới câu "mc": options có 4 phương án, answer để trống. Với "tf": options ["Đúng","Sai"], answer để trống. Với "short": options rỗng, correct = 0.'}],
    output_config:{ effort:'medium', format:{ type:'json_schema', schema:CL_SCHEMA } } };
  const extra={};
  if(m!=='claude-haiku-5-5'){ body.fallbacks='default'; extra['anthropic-beta']='server-side-fallback-2026-07-01'; }   // auto-retry on another model if one declines
  const d=await clFetch(`${CL_API}/messages`, { method:'POST', headers:clHeaders(key, extra), body:JSON.stringify(body) });
  if(d.stop_reason==='refusal'){ const err=new Error('Claude từ chối yêu cầu này — hãy chỉnh lại nội dung bài.'); err.kind='refusal'; throw err; }
  if(d.stop_reason==='max_tokens'){ const err=new Error('Câu trả lời quá dài — hãy giảm số câu hỏi.'); err.kind='long'; throw err; }
  const text=(d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  try{ return JSON.parse(text); }
  catch(e){ const i=text.indexOf('{'), j=text.lastIndexOf('}'); try{ return JSON.parse(text.slice(i,j+1)); }catch(_){ const err=new Error('Claude trả lời sai định dạng, hãy thử lại.'); err.kind='format'; throw err; } }
}
function clErrText(e){
  if(!e) return 'Không tạo được câu hỏi, hãy thử lại.';
  if(e.kind==='network') return location.protocol==='file:' ? 'Không kết nối được tới Anthropic. Kiểm tra mạng Internet rồi thử lại.' : 'Trang này không gọi được API ngoài. Trên link claude.ai hãy dùng Claude có sẵn.';
  if(e.kind==='http'){
    if(e.status===401) return 'Khóa API không đúng hoặc đã bị xóa — hãy sao chép lại khóa.';
    if(e.status===403) return 'Khóa API không có quyền dùng: '+e.message;
    if(e.status===400 && /credit balance/i.test(e.message)) return 'Tài khoản API hết tiền — nạp thêm ở console.anthropic.com → Billing.';
    if(e.status===404) return 'Không tìm thấy mô hình — hãy chọn mô hình khác.';
    if(e.status===429) return 'Gửi quá nhiều yêu cầu, hãy đợi một chút rồi thử lại.';
    if(e.status===529||e.status>=500) return 'Máy chủ Claude đang bận, hãy thử lại sau ít phút.';
    return 'Claude báo lỗi: '+e.message; }
  return e.message||'Không tạo được câu hỏi, hãy thử lại.';
}

const Q_TEMPLATE=`MẪU NHẬP CÂU HỎI — Sân Chơi Ôn Tập
==================================
Cách dùng: soạn câu hỏi theo đúng mẫu dưới đây (mỗi câu cách nhau MỘT DÒNG TRỐNG),
rồi sao chép toàn bộ, dán vào tab "Dán nhanh nhiều câu" và bấm "Thêm vào bộ câu hỏi".
- Trắc nghiệm: đặt dấu * ở đầu phương án đúng (hoặc thêm dòng "Đáp án: B").
- Đúng/Sai: thêm dòng "Đáp án: Đúng" hoặc "Đáp án: Sai".
- Trả lời ngắn: thêm dòng "Đáp án: ..." (không có A, B, C, D).
- Dòng "Giải thích: ..." là tuỳ chọn.
(Xóa phần hướng dẫn này trước khi dán.)

Câu 1: Đơn vị đo độ dài trong hệ đơn vị đo lường hợp pháp của Việt Nam là gì?
A. Centimet
B. Đềximet
*C. Mét
D. Kilômét
Giải thích: Mét (m) là đơn vị đo độ dài chính thức.

Câu 2: Dụng cụ nào dùng để đo khối lượng?
A. Thước dây
B. Cân
C. Đồng hồ
D. Nhiệt kế
Đáp án: B

Câu 3: Nhiệt kế y tế dùng để đo nhiệt độ cơ thể người.
Đáp án: Đúng
Giải thích: Nhiệt kế y tế đo trong khoảng 35°C – 42°C.

Câu 4: Đại lượng cho biết mức độ nóng, lạnh của vật gọi là gì?
Đáp án: Nhiệt độ
`;
function parseCmdTemplate(txt){
  const lines=String(txt).replace(/\r/g,'').split('\n').filter(l=>!/\[VD:|\[Trắc nghiệm, Đúng\/Sai/.test(l));
  const get=re=>{ for(const l of lines){ const m=l.match(re); if(m&&m[1].trim()) return m[1].trim(); } return ''; };
  const subj=get(/^\s*Môn(?: học)?\s*:\s*(.+)$/i), gradeS=get(/^\s*Khối(?: lớp)?\s*:\s*(.+)$/i)||get(/^\s*Lớp\s*:\s*(.+)$/i);
  const lesson=get(/^\s*Tên bài\s*:\s*(.+)$/i), nS=get(/^\s*Số câu\s*:\s*(.+)$/i), typeS=get(/^\s*Dạng câu(?: hỏi)?\s*:\s*(.+)$/i), lv=get(/^\s*Mức độ\s*:\s*(.+)$/i);
  const types=[]; if(/trắc nghiệm/i.test(typeS)) types.push('mc'); if(/đúng|sai/i.test(typeS)) types.push('tf'); if(/ngắn/i.test(typeS)) types.push('short');
  // free sections
  const sec=name=>{ const i=lines.findIndex(l=>new RegExp('^\\s*'+name+'\\s*:\\s*$','i').test(l)); if(i<0) return ''; const out=[]; for(let j=i+1;j<lines.length;j++){ if(/^\s*[^\-\s][^:]{0,30}:\s*$/.test(lines[j])) break; if(lines[j].trim()) out.push(lines[j].trim()); } return out.join('\n'); };
  const focus=sec('Nội dung trọng tâm').split('\n').map(x=>x.replace(/^[-•]\s*/,'')).filter(Boolean).join('; ');
  let cmd=sec('Yêu cầu thêm'); if(lv) cmd=(cmd?cmd+'\n':'')+'- Mức độ: '+lv;
  return { subj, grade:(gradeS.match(/\d+/)||[''])[0], lesson, n:+(nS.match(/\d+/)||[0])[0]||0, types, focus, cmd };
}
function parseBulk(text){
  const blocks=text.replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const out=[];
  for(const b of blocks){
    const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);
    let qLines=[], opts=[], correct=-1, answer='', explain='';
    for(const l of lines){
      let mm;
      if((mm=l.match(/^(\*?)\s*([A-Fa-f])\s*[\.\):]\s*(.*?)(\s*\*)?$/)) && (opts.length || qLines.length)){
        const star=mm[1]||mm[4]; if(star) correct=opts.length; opts.push(mm[3]); continue;
      }
      if((mm=l.match(/^(đáp án|dap an|đ\/a|answer)\s*[:\-]\s*(.+)$/i))){ answer=mm[2].trim(); continue; }
      if((mm=l.match(/^(giải thích|giai thich|lời giải|explain)\s*[:\-]\s*(.+)$/i))){ explain=mm[2].trim(); continue; }
      if(opts.length) { opts[opts.length-1]+=' '+l; continue; }
      qLines.push(l);
    }
    let q=qLines.join('\n').replace(/^(câu|cau|question)\s*\d+\s*[\.:\)]\s*/i,'').replace(/^\d+\s*[\.\)]\s*/,'');
    if(!q) continue;
    if(opts.length>=2){
      if(correct<0 && answer){ const L=answer.trim().charAt(0).toUpperCase(); const k=LETTERS.indexOf(L); if(k>=0 && (answer.trim().length===1 || /^[A-F][\.\):\s]/i.test(answer.trim()))) correct=k; else { const f=opts.findIndex(o=>o.trim().toLowerCase()===answer.toLowerCase()); if(f>=0) correct=f; } }
      out.push(normQ({type:'mc', q, options:opts, correct:Math.max(0,correct), explain}));
    } else if(answer){
      const a=plain(answer);
      if(a==='DUNG'||a==='D'&&false) out.push(normQ({type:'tf',q,correct:0,explain}));
      else if(a==='SAI') out.push(normQ({type:'tf',q,correct:1,explain}));
      else out.push(normQ({type:'short',q,answer,explain}));
    }
  }
  return out;
}

/* ================= Import / Export ================= */
async function exportSet(set){
  const json=JSON.stringify(normSet(set),null,2);
  const name=(plain(set.title).toLowerCase()||'bo-cau-hoi').slice(0,40)+'.json';
  const m=modal(`<h3>Xuất “${esc(set.title)}”</h3><p class="muted">Lưu tệp này để sao lưu hoặc gửi cho đồng nghiệp. Nhập lại bằng nút “Nhập từ tệp / JSON”.</p>
    <textarea rows="8" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(json)}</textarea>
    <div class="foot"><button data-c>Đóng</button><button data-copy>📋 Sao chép</button><button class="primary" data-dl>⬇ Tải tệp .json</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  m.querySelector('[data-copy]').onclick=async()=>{ try{ await navigator.clipboard.writeText(json); toast('Đã sao chép'); }catch(e){ m.querySelector('textarea').select(); toast('Hãy nhấn Ctrl+C để sao chép'); } };
  m.querySelector('[data-dl]').onclick=()=>saveFile(name, json, 'application/json');
}
function exportAll(){
  const data={ app:'san-choi-on-tap', version:1, exportedAt:new Date().toISOString(), sets:S.sets.map(normSet), classes:S.classes.map(normClass) };
  const json=JSON.stringify(data,null,1);
  saveFile('san-choi-on-tap-sao-luu-'+new Date().toISOString().slice(0,10)+'.json', json, 'application/json');
  toast(`Đã xuất ${data.sets.length} bộ câu hỏi và ${data.classes.length} lớp`);
}
function openImport(){
  const m=modal(`<h3>Nhập dữ liệu</h3><p class="muted">Chọn tệp .json đã xuất (một bộ câu hỏi, hoặc tệp <b>sao lưu toàn bộ</b> gồm cả bộ câu hỏi và lớp), hoặc dán nội dung JSON vào ô dưới.</p>
    <button data-file>📂 Chọn tệp…</button>
    <textarea data-json rows="7" placeholder='{"title":"...","questions":[...]}' style="margin-top:10px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
    <div class="foot"><button data-c>Hủy</button><button class="primary" data-go>Nhập</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  const fi=$('#fileIn'); fi.value='';
  m.querySelector('[data-file]').onclick=()=>{ fi.value=''; fi.click(); };
  fi.onchange=async()=>{ const f=fi.files[0]; if(!f) return; m.querySelector('[data-json]').value=await f.text(); };
  m.querySelector('[data-go]').onclick=async()=>{
    let data; try{ data=JSON.parse(m.querySelector('[data-json]').value); }catch(e){ toast('Nội dung JSON không hợp lệ'); return; }
    let sets=[], classes=[];
    if(data && !Array.isArray(data) && (Array.isArray(data.sets)||Array.isArray(data.classes))){ sets=data.sets||[]; classes=data.classes||[]; }
    else sets=Array.isArray(data)?data:[data];
    let n=0, c=0, skip=0;
    for(const s of sets){ if(!s||!Array.isArray(s.questions)) continue;
      const ex=S.sets.find(x=>x.id===s.id);
      if(ex && JSON.stringify(normSet(ex).questions)===JSON.stringify(normSet(s).questions) && ex.title===s.title){ skip++; continue; }
      if(await saveSet({...s, id: ex?uid():s.id})) n++; }
    for(const k of classes){ if(!k||!Array.isArray(k.students)) continue;
      const ex=S.classes.find(x=>x.id===k.id);
      if(ex && ex.name===k.name && ex.students.join('|')===normClass(k).students.join('|')){ skip++; continue; }
      if(await saveItem('classes',{...k, id: ex?uid():k.id})) c++; }
    if(n||c){ m.remove(); toast(`Đã nhập ${n} bộ câu hỏi, ${c} lớp`+(skip?` (bỏ qua ${skip} mục đã có)`:'')); }
    else toast(skip?'Các mục này đều đã có sẵn':'Không tìm thấy dữ liệu hợp lệ');
  };
}

function netUpdate(){

  let pill=$('#netpill');
  if(S.offline && !pill){ pill=h('<div id="netpill" class="netpill">📡 Mất kết nối Internet — đang chờ có mạng lại…</div>'); document.body.appendChild(pill); }
  if(!S.offline && pill){ pill.remove(); toast('✓ Đã có mạng trở lại'); }
  render();
}

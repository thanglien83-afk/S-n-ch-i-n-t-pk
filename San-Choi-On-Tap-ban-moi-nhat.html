<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sân Chơi Ôn Tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f2433; --muted:#6b7183; --line:#e4e1d8;
  --brand:#2b59c3; --brand2:#1d3f91; --gold:#f2b705; --gold2:#c98a00;
  --ok:#1f9d55; --bad:#d64545;
  --a:#d64545; --b:#2b59c3; --c:#d98b00; --d:#1f9d55;
  --radius:14px; --shadow:0 2px 10px rgba(30,36,51,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#ebe8e0;color:var(--ink);font-weight:600;transition:transform .08s,background .15s}
button:hover{background:#e0dcd1}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--brand);color:#fff}
button.primary:hover{background:var(--brand2)}
button.gold{background:var(--gold);color:#3a2a00}
button.gold:hover{background:#e0a800}
button.danger{background:#fbe5e5;color:var(--bad)}
button.ghost{background:transparent}
button.ghost:hover{background:rgba(0,0,0,.06)}
button.sm{padding:6px 10px;font-size:13px}
input,textarea,select{font:inherit;color:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}

/* Header */
header.top{background:linear-gradient(110deg,#2b59c3 0%,#5b3df5 55%,#c2185b 120%);box-shadow:0 4px 20px rgba(43,89,195,.35);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
header.top .tag{font-size:12px;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:22px}
h2.sec{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}

/* Game cards */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.game{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s;text-align:left;display:block;width:100%;font-weight:400}
.game:hover{border-color:var(--brand);transform:translateY(-2px);background:var(--card)}
.game .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.game b{display:block;font-size:16px;margin-bottom:3px}
.game span{font-size:13px;color:var(--muted)}

/* Sets */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.set{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px}
.set h3{margin:0;font-size:16px}
.set .meta{font-size:13px;color:var(--muted)}
.set .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:30px;text-align:center;color:var(--muted)}
.notice{background:#fff8e0;border:1px solid #f0dc9a;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,36,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:980px}
.modal h3{margin:0 0 6px;font-size:19px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* Editor */
.qitem{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fcfbf8}
.qitem .qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qitem .num{background:var(--brand);color:#fff;border-radius:8px;padding:2px 9px;font-weight:700;font-size:13px}
.opt{display:flex;gap:8px;align-items:center;margin-top:6px}
.opt .L{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.opt input[type=radio]{width:18px;height:18px;flex:none;accent-color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:12px 0}
.tabs button{background:none;border-radius:8px 8px 0 0;padding:8px 14px;color:var(--muted)}
.tabs button.on{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
pre.fmt{background:#f3f1ec;border-radius:10px;padding:10px;font-size:12.5px;white-space:pre-wrap;margin:6px 0}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:100;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

/* ===== Stage (game screen) ===== */
#stage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:radial-gradient(circle at 12% -10%,rgba(124,77,255,.55) 0%,transparent 45%),radial-gradient(circle at 100% 110%,rgba(233,30,99,.45) 0%,transparent 45%),radial-gradient(circle at 85% 10%,rgba(0,188,212,.25) 0%,transparent 35%),linear-gradient(165deg,#1b2a8a 0%,#0c1446 60%,#140b3d 100%);color:#fff;overflow:hidden}
#stage .sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.18)}
#stage .sbar .t{font-weight:700;font-size:16px}
#stage .sbar .s{opacity:.7;font-size:14px}
#stage .sbar button{background:rgba(255,255,255,.12);color:#fff}
#stage .sbar button:hover{background:rgba(255,255,255,.22)}
#stage .sbody{flex:1;overflow:auto;display:flex;flex-direction:column;padding:16px clamp(12px,3vw,40px)}
#stage button.st{background:rgba(255,255,255,.14);color:#fff;font-size:16px;padding:11px 18px}
#stage button.st:hover{background:rgba(255,255,255,.25)}
#stage button.st.gold{background:var(--gold);color:#3a2a00}
#stage button.st.gold:hover{background:#ffcb2e}
#stage button.st.green{background:var(--ok)}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 0 4px}

.qwrap{flex:1;display:flex;flex-direction:column;gap:16px;max-width:1200px;width:100%;margin:0 auto;justify-content:center}
.qtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qnum{background:linear-gradient(135deg,#ffe066,#f2b705);box-shadow:0 4px 14px rgba(242,183,5,.45);color:#3a2a00;font-weight:800;border-radius:99px;padding:6px 16px;font-size:clamp(15px,1.6vw,20px)}
.qtext{background:#fff;color:#16205a;border-top:7px solid var(--gold);border-radius:18px;padding:clamp(16px,2.5vw,32px);font-size:clamp(20px,2.8vw,40px);font-weight:700;text-align:center;line-height:1.3;box-shadow:0 6px 0 rgba(0,0,0,.2);white-space:pre-wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.2vw,16px)}
.opts.one{grid-template-columns:1fr}
.o{display:flex;align-items:center;gap:14px;border-radius:14px;padding:clamp(10px,1.4vw,18px) clamp(12px,1.6vw,22px);font-size:clamp(17px,2vw,30px);font-weight:600;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:opacity .3s,transform .3s,box-shadow .3s;text-align:left}
.o .k{background:rgba(255,255,255,.25);border-radius:10px;min-width:1.8em;height:1.8em;display:grid;place-items:center;font-weight:800;flex:none}
.o.dim{opacity:.28;transform:scale(.97)}
.o.win{box-shadow:0 0 0 5px #fff,0 0 30px 8px rgba(255,255,255,.6);transform:scale(1.02)}
.o.win::after{content:"✓";margin-left:auto;font-size:1.3em}
.shortbox{background:rgba(255,255,255,.1);border:3px dashed rgba(255,255,255,.4);border-radius:16px;padding:20px;text-align:center;font-size:clamp(18px,2.4vw,34px);font-weight:700}
.shortbox.win{background:var(--ok);border-style:solid;border-color:#fff}
.explain{background:rgba(255,255,255,.95);color:var(--ink);border-left:6px solid var(--gold);border-radius:12px;padding:12px 16px;font-size:clamp(14px,1.5vw,20px)}

.timer{position:relative;width:clamp(64px,7vw,96px);height:clamp(64px,7vw,96px);flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(22px,2.6vw,36px)}
.timer.low .n{color:#ff8a8a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}

.counter{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 6px 4px 14px;font-weight:600}
.counter b{font-size:20px;min-width:2ch;text-align:center}
.counter button{border-radius:99px;width:32px;height:32px;padding:0;background:rgba(255,255,255,.18);color:#fff}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.big{font-size:clamp(30px,5vw,68px);font-weight:800;line-height:1.1;letter-spacing:-.5px}
.bell{width:clamp(120px,18vw,220px);filter:drop-shadow(0 8px 30px rgba(242,183,5,.6))}
.bell.ring{animation:ring 1.2s ease-in-out infinite;transform-origin:50% 8%}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none;animation:fl 1.8s forwards}
.flash div{background:var(--gold);color:#3a2a00;font-size:clamp(30px,6vw,80px);font-weight:800;padding:20px 50px;border-radius:24px;box-shadow:0 10px 60px rgba(0,0,0,.4)}
@keyframes fl{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

/* Team */
.teamlayout{flex:1;display:flex;gap:20px;min-height:0}
.teamlayout .qwrap{min-width:0}
.board{width:clamp(200px,22vw,300px);display:flex;flex-direction:column;gap:10px;justify-content:center}
.team{border-radius:14px;padding:12px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.team .nm{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.team .sc{font-size:34px;font-weight:800;line-height:1.1}
.team .bt{display:flex;gap:6px;margin-top:6px}
.team .bt button{flex:1;background:rgba(255,255,255,.25);color:#fff;padding:6px}
.team.lead{outline:4px solid var(--gold)}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center}
.podium .p{border-radius:14px 14px 0 0;width:clamp(100px,14vw,170px);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:12px;font-weight:700;color:#fff}

/* Flashcards */
.fc-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.fc{width:min(820px,92vw);height:min(460px,55vh);perspective:1600px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);overflow:auto}
.fc .front{background:#fff;color:var(--ink)}
.fc .back{background:var(--gold);color:#3a2a00;transform:rotateY(180deg)}
.fc .face .lab{position:absolute;top:14px;left:18px;font-size:13px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.6px}
.fc .face .main{font-size:clamp(20px,2.8vw,38px);font-weight:700;white-space:pre-wrap}
.fc .face .sub{font-size:clamp(14px,1.5vw,19px);margin-top:12px;opacity:.85}
.fc .face ol{text-align:left;font-size:clamp(15px,1.7vw,22px);margin:14px 0 0;padding-left:1.4em}
.progress{width:min(820px,92vw);height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}

/* Wheel */
.wheel-layout{flex:1;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.wheel-box{position:relative;width:min(560px,80vw,68vh);aspect-ratio:1}
.wheel-box canvas{width:100%;height:100%;display:block}
.wheel-box .pin{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:44px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.wheel-box .hub{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);border-radius:50%;background:var(--gold);border:6px solid #fff;display:grid;place-items:center;font-weight:800;color:#3a2a00;cursor:pointer;font-size:clamp(14px,2vw,20px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.wheel-side{width:min(320px,90vw);display:flex;flex-direction:column;gap:12px}
.wheel-side textarea{min-height:200px;background:rgba(255,255,255,.95)}

/* Crossword */
.cw-layout{flex:1;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding-top:8px}
.cw-grid{display:flex;flex-direction:column;gap:5px}
.cw-row{display:flex;gap:5px;align-items:center}
.cw-row .rn{width:34px;height:var(--cs);border-radius:8px;background:var(--gold);color:#3a2a00;font-weight:800;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}
.cw-row.sel .rn{background:#fff}
.cw-row.done .rn{background:var(--ok);color:#fff}
.cw-row.fail .rn{background:var(--bad);color:#fff}
.cw-c{width:var(--cs);height:var(--cs);flex:none;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:calc(var(--cs)*.55)}
.cw-c.blank{background:transparent}
.cw-c.box{background:#fff;color:var(--brand2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cw-c.key{background:#ffe48a;color:#7a3b00;box-shadow:0 0 0 3px var(--gold)}
.cw-c.box.hid,.cw-c.key.hid{color:transparent}
.cw-c.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cw-side{width:min(440px,92vw);display:flex;flex-direction:column;gap:12px}
.cw-q{background:#fff;color:var(--ink);border-radius:14px;padding:16px;font-size:clamp(16px,1.7vw,22px);font-weight:600;min-height:110px}
.cw-q .h{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase}
.keyrow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}

/* Memory */
.mem-grid{display:grid;gap:clamp(6px,1vw,12px);flex:1;max-width:1100px;width:100%;margin:0 auto;align-content:center}
.mc{aspect-ratio:4/3;perspective:900px;cursor:pointer}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:grid;place-items:center;padding:8px;text-align:center;font-weight:600;overflow:hidden;font-size:clamp(11px,1.15vw,16px);line-height:1.25}
.mc .bk{background:linear-gradient(135deg,var(--gold),#ff9f1a);color:#3a2a00;font-size:clamp(22px,3vw,40px);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mc .fr{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.mc .fr.ans{background:#e7f0ff}
.mc.got .fr{background:var(--ok);color:#fff}
.mc.shake .in{animation:shake .4s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}

/* Student floor (sàn đấu) */
.floor{width:clamp(220px,24vw,340px);display:flex;flex-direction:column;gap:8px;min-height:0}
.floor .fh{display:flex;align-items:center;gap:8px;font-weight:700}
.floor .fh b{color:var(--gold);font-size:22px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:5px;overflow:auto;align-content:start;flex:1;padding:2px}
.chip{background:rgba(255,255,255,.14);border-radius:8px;padding:4px 7px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s,background .3s;user-select:none;color:#fff}
.chip i{font-style:normal;opacity:.6;font-size:11px;min-width:1.4em}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.out{opacity:.28;text-decoration:line-through}
.chip.ok{background:var(--ok)}
.chip.bad{background:var(--bad)}
.chip.got{background:#3d6fe0}
.chip .bd{margin-left:auto;background:rgba(0,0,0,.25);border-radius:5px;padding:0 5px;font-size:11px}
.layout2{flex:1;display:flex;gap:20px;min-height:0}
.layout2 .qwrap{min-width:0}

/* Scanner */
.scan{position:absolute;top:52px;right:0;bottom:0;width:min(520px,42vw);z-index:20;background:rgba(9,15,48,.97);border-left:3px solid var(--gold);display:flex;flex-direction:column;gap:10px;padding:12px;color:#fff;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
.scan .scan-main{flex:none}
.scan .scan-view{flex:none;height:34vh;min-height:170px}
.scan .scan-side{width:100%;flex:1;min-height:0}
.scan .scan-side .chips{max-height:none}
#stage.side-scan .sbody{margin-right:min(520px,42vw)}
#stage.side-scan .credit{margin-right:min(520px,42vw)}
#stage.side-scan .floor,#stage.side-scan .board{display:none}
.dqr{display:flex;align-items:center;gap:10px;background:#fff;color:#16205a;border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;font-weight:700;line-height:1.3}
.dqr svg{display:block}
.qrfloat{position:absolute;top:62px;right:16px;z-index:23;flex-direction:column;text-align:center;padding:10px;box-shadow:0 8px 30px rgba(0,0,0,.45);border:3px solid var(--gold);animation:pop .35s}
.scandock{flex-wrap:nowrap;font-size:14px}
.scandock>b{white-space:nowrap}
.paircard{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.1);border:2px dashed rgba(242,183,5,.7);border-radius:18px;padding:12px 18px;text-align:left;max-width:640px}
.paircard .qrbox{background:#fff;border-radius:12px;padding:6px;line-height:0}
.scan-main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.scan-view{flex:1;background:#000;border-radius:14px;overflow:hidden;display:grid;place-items:center;position:relative;min-height:200px}
.scan-view canvas{max-width:100%;max-height:100%;display:block}
.scan-view .ph{position:absolute;text-align:center;opacity:.8;padding:20px;max-width:520px;line-height:1.6}
.scan-side{width:clamp(240px,28vw,380px);display:flex;flex-direction:column;gap:10px;min-height:0}
.scan-side .cnt{font-size:26px;font-weight:800}
.sumlist{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;font-size:14px;max-height:30vh;overflow:auto}
.sumlist b{display:block;margin-bottom:4px}

.namepick{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.55);cursor:pointer}
.namepick div{background:var(--gold);color:#3a2a00;border-radius:24px;padding:24px 56px;text-align:center;box-shadow:0 10px 60px rgba(0,0,0,.4);animation:pop .4s}
.namepick small{display:block;font-size:18px;opacity:.7}
.namepick b{display:block;font-size:clamp(34px,6vw,84px);line-height:1.15}

#phone{position:fixed;inset:0;z-index:45;background:radial-gradient(ellipse at top,#21408f 0%,#0f1e4a 70%);color:#fff;display:flex;flex-direction:column;gap:12px;padding:14px;overflow:auto}

<script>
/* ================= Utilities ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = ['A','B','C','D','E','F'];
const CREDIT = 'GV Nguyễn Diệu Liên - THCS CVA';
const OPTC = ['linear-gradient(135deg,#ff5470,#d6204a)','linear-gradient(135deg,#3fa3ff,#2b59c3)','linear-gradient(135deg,#ffb020,#f07800)','linear-gradient(135deg,#2ed47a,#13945a)','linear-gradient(135deg,#b06cff,#7b2ff7)','linear-gradient(135deg,#2ad4c4,#118a7e)'];
const TEAMC = ['#e8344e','#2f7bf0','#16a864','#f08c00','#8b3cf7','#0fa89a'];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('on'),2200); }
function h(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function plain(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ================= Sound ================= */
let AC=null, muted=false;
try{ muted = localStorage.getItem('scot_muted')==='1'; }catch(e){}
function ac(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(f, dur, type='sine', vol=.2, when=0){
  if(muted) return; const c=ac(); if(!c) return;
  const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx={
  tick(){tone(1100,.05,'square',.05)},
  click(){tone(700,.04,'triangle',.08)},
  correct(){tone(660,.18,'triangle',.25);tone(880,.18,'triangle',.25,.12);tone(1320,.35,'triangle',.2,.24)},
  wrong(){tone(200,.4,'sawtooth',.1);tone(150,.4,'sawtooth',.1,.15)},
  timeup(){tone(392,.25,'square',.1);tone(262,.6,'square',.1,.25)},
  bell(){ [0,.45,.9].forEach(w=>[1,2.76,5.4,8.93].forEach((m,i)=>tone(784*m,2.4/(i+1),'sine',.22/(i+1),w))) },
  flip(){tone(500,.06,'triangle',.08)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.2,i*.13))}
};

/* ===== Answer-card detector (own implementation, no libraries) =====
   Card = 6x6 grid: black frame + 4x4 data cells, white quiet zone around.
   detectCards(imageData) -> [{id, ans (0..3 = A..D), corners:[[x,y]x4]}] */
const CARD_CODES=[22295,2362,17865,13438,48327,49261,11094,5846,59362,10906,38227,20895,6221,20696,59504,39699,37910,43459,50777,36539,47602,39439,24913,37332,4551,2001,35450,54788,6078,12796,27621,12497,37594,11475,37369,63062,41303,47189,20652,42745,18609,19821,32883,19934,64338,31937,16850,64332,7472,7285,18268,437,61144,57825,64566,1738,10143,61377,30456,1254,60517,45389,7649,17340,39972,19186,33962,40171,45303,52625,5747,18969,14747,1530,9070,54402,59538,9139,57666,54881,42389,40518,383,10672,45793,10365,42065,50675,59675,46299,29533,11306,14532,1203,28773,25688,3681,54459,18598,9972];
const MAX_CARDS=CARD_CODES.length;
function cardRot(c){ let o=0; for(let i=0;i<4;i++)for(let j=0;j<4;j++){ if((c>>(15-(i*4+j)))&1) o|=1<<(15-(j*4+(3-i))); } return o; }
const CARD_ROTS=CARD_CODES.map(c=>{ const r=[c]; for(let k=1;k<4;k++) r.push(cardRot(r[k-1])); return r; });
function popc(x){ x=x-((x>>1)&0x5555); x=(x&0x3333)+((x>>2)&0x3333); x=(x+(x>>4))&0x0f0f; return (x+(x>>8))&0x1f; }
// card turned clockwise k*90deg => this side is on top. Layout: A top, B right, C bottom, D left
const ROT_TO_ANS=[0,3,2,1];

function detectCards(img){
  const W=img.width, H=img.height, d=img.data, N=W*H;
  const g=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4) g[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;
  // integral image
  const IW=W+1, I=new Uint32Array(IW*(H+1));
  for(let y=0;y<H;y++){ let s=0; for(let x=0;x<W;x++){ s+=g[y*W+x]; I[(y+1)*IW+x+1]=I[y*IW+x+1]+s; } }
  const R=Math.max(6, Math.round(Math.min(W,H)/18));
  const bin=new Uint8Array(N);
  for(let y=0;y<H;y++){ const y0=Math.max(0,y-R), y1=Math.min(H,y+R+1);
    for(let x=0;x<W;x++){ const x0=Math.max(0,x-R), x1=Math.min(W,x+R+1);
      const sum=I[y1*IW+x1]-I[y0*IW+x1]-I[y1*IW+x0]+I[y0*IW+x0];
      const mean=sum/((x1-x0)*(y1-y0));
      bin[y*W+x]= g[y*W+x] < mean*0.86-3 ? 1:0; } }
  // connected components (4-neighbour)
  const lab=new Int32Array(N), stack=new Int32Array(N); let nl=0; const out=[]; const seen=new Set();
  const minSide=Math.max(12, Math.round(Math.min(W,H)*0.012)), maxSide=Math.min(W,H)*0.95;
  for(let s=0;s<N;s++){
    if(!bin[s]||lab[s]) continue;
    nl++; let sp=0; stack[sp++]=s; lab[s]=nl;
    let minx=W,maxx=0,miny=H,maxy=0,cnt=0;
    while(sp){ const p=stack[--sp]; const x=p%W, y=(p-x)/W; cnt++;
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      if(x>0&&bin[p-1]&&!lab[p-1]){lab[p-1]=nl;stack[sp++]=p-1;}
      if(x<W-1&&bin[p+1]&&!lab[p+1]){lab[p+1]=nl;stack[sp++]=p+1;}
      if(y>0&&bin[p-W]&&!lab[p-W]){lab[p-W]=nl;stack[sp++]=p-W;}
      if(y<H-1&&bin[p+W]&&!lab[p+W]){lab[p+W]=nl;stack[sp++]=p+W;} }
    const bw=maxx-minx+1, bh=maxy-miny+1;
    if(Math.max(bw,bh)<minSide || Math.max(bw,bh)>maxSide) continue;
    if(bw>bh*3.5||bh>bw*3.5) continue;
    if(cnt<0.2*bw*bh) continue;
    const m=analyse(nl,minx,maxx,miny,maxy,cnt);
    if(m && !seen.has(m.id)){ seen.add(m.id); out.push(m); }
  }
  return out;

  function analyse(id,minx,maxx,miny,maxy,cnt){
    // boundary points: leftmost/rightmost pixel of each row
    const pts=[];
    for(let y=miny;y<=maxy;y++){ let l=-1,r=-1; const row=y*W;
      for(let x=minx;x<=maxx;x++) if(lab[row+x]===id){ l=x; break; }
      if(l<0) continue;
      for(let x=maxx;x>=l;x--) if(lab[row+x]===id){ r=x; break; }
      pts.push([l,y],[r+1,y],[l,y+1],[r+1,y+1]); }
    const hull=convexHull(pts); if(hull.length<4) return null;
    const hA=polyArea(hull);
    let cx=0,cy=0; for(const p of hull){cx+=p[0];cy+=p[1];} cx/=hull.length; cy/=hull.length;
    const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
    let p0=hull[0]; for(const p of hull) if(d2(p,[cx,cy])>d2(p0,[cx,cy])) p0=p;
    let p2=hull[0]; for(const p of hull) if(d2(p,p0)>d2(p2,p0)) p2=p;
    const side=p=>(p2[0]-p0[0])*(p[1]-p0[1])-(p2[1]-p0[1])*(p[0]-p0[0]);
    let p1=null,p3=null,s1=0,s3=0;
    for(const p of hull){ const s=side(p); if(s>s1){s1=s;p1=p} if(s<s3){s3=s;p3=p} }
    if(!p1||!p3) return null;
    let q=[p0,p1,p2,p3];
    const qA=polyArea(q); if(qA<=0 || qA/hA<0.86) return null;
    const fill=cnt/qA; if(fill<0.4||fill>0.97) return null;
    const L=[0,1,2,3].map(i=>Math.sqrt(d2(q[i],q[(i+1)%4])));
    if(Math.min(...L)/Math.max(...L)<0.35) return null;
    // order clockwise (y down), starting near top-left
    const qc=[(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4];
    q.sort((a,b)=>Math.atan2(a[1]-qc[1],a[0]-qc[0])-Math.atan2(b[1]-qc[1],b[0]-qc[0]));
    let st=0,best=1e9; q.forEach((p,i)=>{ let a=Math.atan2(p[1]-qc[1],p[0]-qc[0])+3*Math.PI/4; a=Math.abs(Math.atan2(Math.sin(a),Math.cos(a))); if(a<best){best=a;st=i;} });
    q=[0,1,2,3].map(i=>q[(st+i)%4]);
    // small inward shrink compensation is not needed: hull is outer edge of frame
    const map=sq2quad(q);
    const vals=new Array(36);
    for(let i=0;i<6;i++)for(let j=0;j<6;j++){ let s=0,n=0;
      for(const [du,dv] of [[0,0],[-.2,0],[.2,0],[0,-.2],[0,.2]]){ const [x,y]=map((j+.5+du)/6,(i+.5+dv)/6); const v=sampleG(x,y); if(v>=0){s+=v;n++;} }
      if(!n) return null; vals[i*6+j]=s/n; }
    let bMax=0,bSum=0,iMin=255,iMax=0;
    for(let i=0;i<6;i++)for(let j=0;j<6;j++){ const v=vals[i*6+j]; if(i===0||j===0||i===5||j===5){ bSum+=v; if(v>bMax)bMax=v; } else { if(v<iMin)iMin=v; if(v>iMax)iMax=v; } }
    const bMean=bSum/20; if(iMax-bMean<25) return null;
    const t=(bMean+iMax)/2; if(bMax>t) return null;
    let code=0; for(let i=1;i<5;i++)for(let j=1;j<5;j++){ code=(code<<1)|(vals[i*6+j]>t?1:0); }
    let bd=99,bid=-1,bk=0;
    for(let c=0;c<CARD_ROTS.length;c++){ const rs=CARD_ROTS[c]; for(let k=0;k<4;k++){ const dd=popc(code^rs[k]); if(dd<bd){bd=dd;bid=c;bk=k;} } }
    if(bd>1) return null;
    return {id:bid, ans:ROT_TO_ANS[bk], corners:q};
  }
  function sampleG(x,y){ if(x<0||y<0||x>=W-1||y>=H-1) return -1; const xi=x|0, yi=y|0, fx=x-xi, fy=y-yi, p=yi*W+xi;
    return g[p]*(1-fx)*(1-fy)+g[p+1]*fx*(1-fy)+g[p+W]*(1-fx)*fy+g[p+W+1]*fx*fy; }
}
function convexHull(P){ P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[]; for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  const up=[]; for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up); }
function polyArea(q){ let a=0; for(let i=0;i<q.length;i++){ const p=q[i], n=q[(i+1)%q.length]; a+=p[0]*n[1]-n[0]*p[1]; } return Math.abs(a)/2; }
function sq2quad(p){ const [x0,y0]=p[0],[x1,y1]=p[1],[x2,y2]=p[2],[x3,y3]=p[3];
  const dx1=x1-x2, dx2=x3-x2, dy1=y1-y2, dy2=y3-y2, sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  let gg=0,hh=0; if(Math.abs(sx)>1e-9||Math.abs(sy)>1e-9){ const den=dx1*dy2-dx2*dy1; gg=(sx*dy2-dx2*sy)/den; hh=(dx1*sy-sx*dy1)/den; }
  const a=x1-x0+gg*x1, b=x3-x0+hh*x3, c=x0, dd=y1-y0+gg*y1, e=y3-y0+hh*y3, f=y0;
  return (u,v)=>{ const w=gg*u+hh*v+1; return [(a*u+b*v+c)/w,(dd*u+e*v+f)/w]; }; }

/* Card SVG: 12x12 units. marker 6 units centred (3..9), quiet zone, letters in outer band */
function cardSVG(idx, label){
  const c=CARD_CODES[idx]; let cells='';
  for(let i=0;i<4;i++)for(let j=0;j<4;j++) if((c>>(15-(i*4+j)))&1) cells+=`<rect x="${4+j}" y="${4+i}" width="1.02" height="1.02" fill="#fff"/>`;
  const L=(t,x,y,r)=>`<text x="${x}" y="${y}" transform="rotate(${r} ${x} ${y})" font-size="1.1" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#555" font-family="Arial,sans-serif">${t}</text>`;
  const lab=label?`<text x="0.5" y="0.75" font-size="0.48" fill="#999" font-family="Arial,sans-serif">${label}</text>`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><rect width="12" height="12" fill="#fff"/><rect x="3" y="3" width="6" height="6" fill="#000"/>${cells}`+
    L('A',6,1.4,0)+L('B',10.6,6,90)+L('C',6,10.6,180)+L('D',1.4,6,270)+
    `<text x="11.5" y="11.45" font-size="0.6" font-weight="700" fill="#999" text-anchor="end" font-family="Arial,sans-serif">${idx+1}</text>`+lab+`</svg>`;
}

/* ================= Background music (synthesised, original loop) ================= */
const MUSIC={on:true, timer:null, next:0, step:0, bus:null, noise:null, cycle:0};
try{ MUSIC.on = localStorage.getItem('scot_music')!=='0'; }catch(e){}
function musicStart(){
  if(!MUSIC.on || MUSIC.timer) return; const c=ac(); if(!c) return;
  if(!MUSIC.noise){ const b=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; MUSIC.noise=b; }
  MUSIC.bus=c.createGain(); MUSIC.bus.gain.setValueAtTime(0,c.currentTime); MUSIC.bus.gain.linearRampToValueAtTime(0.42,c.currentTime+1.5); MUSIC.bus.connect(c.destination);
  MUSIC.next=c.currentTime+0.15; MUSIC.step=0; MUSIC.cycle=0;
  MUSIC.timer=setInterval(musicTick,25);
}
function musicStop(){
  clearInterval(MUSIC.timer); MUSIC.timer=null;
  if(MUSIC.bus&&AC){ const g=MUSIC.bus; g.gain.cancelScheduledValues(AC.currentTime); g.gain.setTargetAtTime(0,AC.currentTime,0.12); setTimeout(()=>{ try{g.disconnect()}catch(e){} },900); }
  MUSIC.bus=null;
}
function musicDuck(on){ if(MUSIC.bus&&AC){ MUSIC.bus.gain.setTargetAtTime(on?0.16:0.42, AC.currentTime, 0.2); } }
const M_BPM=128, M_S16=60/M_BPM/4;
const M_BASS=[45,41,48,43];                       // A F C G
const M_CHORD=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]];
const M_MEL=[[69,0,72,0,76,0,74,72,0,69,0,72,74,0,72,0],[65,0,69,0,72,0,74,72,0,69,0,65,67,0,69,0],
             [67,0,72,0,76,0,79,76,0,74,0,72,74,0,76,0],[74,0,71,0,67,0,71,74,0,79,0,78,79,0,74,0]];
const mtof=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){
  const c=AC; if(!c||!MUSIC.bus) return;
  while(MUSIC.next < c.currentTime+0.12){ musicStep(MUSIC.step, MUSIC.next); MUSIC.next+=M_S16; MUSIC.step=(MUSIC.step+1)%64; if(MUSIC.step===0) MUSIC.cycle++; }
}
function mVoice(type,f,t,dur,vol,filt){
  const c=AC, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=o; if(filt){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=filt; o.connect(fl); node=fl; }
  node.connect(g).connect(MUSIC.bus); o.start(t); o.stop(t+dur+0.05);
}
function mNoise(t,dur,vol,type,freq){
  const c=AC, src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); src.buffer=MUSIC.noise; f.type=type; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); src.connect(f).connect(g).connect(MUSIC.bus); src.start(t); src.stop(t+dur+0.02);
}
function musicStep(step,t){
  const c=AC, bar=Math.floor(step/16), s=step%16;
  if(s%4===0){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.connect(g).connect(MUSIC.bus); o.start(t); o.stop(t+0.2); }
  if(s===4||s===12){ mNoise(t,0.16,0.35,'bandpass',1900); mVoice('triangle',190,t,0.09,0.18); }
  if(s%2===0) mNoise(t,0.035,s%4===2?0.16:0.07,'highpass',7500);
  if([0,3,6,8,11,14].includes(s)) mVoice('sawtooth',mtof(M_BASS[bar]+(s===8?12:0)),t,M_S16*1.7,0.16,700);
  if(s===2||s===10||s===7) M_CHORD[bar].forEach(n=>mVoice('triangle',mtof(n),t,0.16,0.045));
  if(MUSIC.cycle%2===1){ const n=M_MEL[bar][s]; if(n) mVoice('square',mtof(n),t,M_S16*1.8,0.05,2600); }
}

/* ================= Data ================= */
const S = { sets:[], classes:[], db:null, mode:'local', canEdit:true, loaded:false, sample:null, downloads:null };

function normQ(q){
  q = q||{};
  let type = ['mc','tf','short'].includes(q.type) ? q.type : (Array.isArray(q.options)&&q.options.length ? 'mc' : (q.answer ? 'short':'mc'));
  let options = Array.isArray(q.options) ? q.options.map(x=>String(x??'')).slice(0,6) : [];
  if(type==='tf') options=['Đúng','Sai'];
  if(type==='mc' && options.length<2) options = options.concat(['','','','']).slice(0,4);
  let correct = Number.isInteger(+q.correct) ? +q.correct : 0;
  correct = clamp(correct,0,Math.max(0,options.length-1));
  return { id:String(q.id||uid()), type, q:String(q.q||''), options, correct, answer:String(q.answer||''), explain:String(q.explain||''), time:clamp(Math.round(+q.time||0),0,600), cross:String(q.cross||'') };
}
function normSet(s){
  s = s||{};
  return { id:String(s.id||uid()), title:String(s.title||'Bộ câu hỏi mới'), subject:String(s.subject||''), grade:String(s.grade||''),
    time:clamp(Math.round(+s.time||20),5,600), keyword:String(s.keyword||''), keywordHint:String(s.keywordHint||''),
    questions:(Array.isArray(s.questions)?s.questions:[]).map(normQ), updatedAt:+s.updatedAt||Date.now() };
}
function correctText(q){ return q.type==='short' ? q.answer : (q.options[q.correct]||''); }
function crossWord(q){ return plain(q.cross || correctText(q)); }
function qTime(q,set){ return q.time || set.time || 20; }

function normClass(c){ c=c||{}; return { id:String(c.id||uid()), name:String(c.name||'Lớp mới'), students:(Array.isArray(c.students)?c.students:[]).map(s=>String(s||'').trim()).filter(Boolean).slice(0,MAX_CARDS), updatedAt:+c.updatedAt||Date.now() }; }
function shortName(full){ const p=String(full).trim().split(/\s+/); return p[p.length-1]||full; }

// kind: 'sets' | 'classes'
const KINDS={ sets:{key:'scot_sets_v1', norm:normSet}, classes:{key:'scot_classes_v1', norm:normClass} };
function loadLocal(kind='sets'){ try{ const a=JSON.parse(localStorage.getItem(KINDS[kind].key)||'[]'); return Array.isArray(a)?a.map(KINDS[kind].norm):[]; }catch(e){ return []; } }
function saveLocal(kind='sets'){ try{ localStorage.setItem(KINDS[kind].key, JSON.stringify(S[kind])); return true; }catch(e){ toast('Không lưu được vào trình duyệt'); return false; } }

async function saveItem(kind, obj){
  obj = KINDS[kind].norm({...obj, updatedAt:Date.now()});
  if(S.mode==='db'){
    try{ await S.db.collection(kind).doc(obj.id).set(obj); }
    catch(e){
      if(e && e.code==='quota_exceeded') toast('Kho lưu trữ đã đầy, hãy xóa bớt dữ liệu cũ');
      else if(e && e.code==='invalid_argument'){ toast('Bạn không có quyền sửa (chỉ xem)'); S.canEdit=false; render(); }
      else toast('Lưu thất bại, thử lại sau');
      return false;
    }
    const i=S[kind].findIndex(x=>x.id===obj.id); if(i>=0) S[kind][i]=obj; else S[kind].push(obj);
  } else {
    const i=S[kind].findIndex(x=>x.id===obj.id); if(i>=0) S[kind][i]=obj; else S[kind].push(obj);
    if(!saveLocal(kind)) return false;
  }
  render(); return true;
}
async function deleteItem(kind, id){
  if(S.mode==='db'){ try{ await S.db.collection(kind).doc(id).delete(); }catch(e){ toast('Xóa thất bại'); return; } }
  S[kind]=S[kind].filter(x=>x.id!==id); if(S.mode!=='db') saveLocal(kind); render(); toast('Đã xóa');
}
const saveSet=s=>saveItem('sets',s), deleteSet=id=>deleteItem('sets',id);

async function initCapabilities(){
  S.sets = loadLocal('sets'); S.classes = loadLocal('classes'); render();
  if(!window.claude || !window.claude.use){ S.loaded=true; S.mode='local'; render(); return; }
  claude.use('sample').then(x=>{ S.sample=x; }).catch(()=>{});
  claude.use('downloads').then(x=>{ S.downloads=x; }).catch(()=>{});
  claude.use('room').then(x=>{ S.room=x; S.roomTried=true; render(); if(PAIR_FROM_URL) setTimeout(pairFromUrl, 600); }).catch(()=>{ S.roomTried=true; });
  let db=null; try{ db = await claude.use('db'); }catch(e){}
  if(!db){ S.loaded=true; S.mode='local'; render(); return; }
  S.db=db; S.mode='db';
  try{ const u = await claude.use('user'); if(u){ let ce=null; try{ ce = await u.can('data.write'); }catch(e){} if(ce===false) S.canEdit=false; } }catch(e){}
  S.sets=[]; S.classes=[]; render();
  db.collection('classes').onSnapshot(snap=>{ S.classes=snap.docs.map(d=>normClass({...d.data(), id:d.id})); render(); }, ()=>{});
  const timer=setTimeout(()=>{ if(!S.loaded){ S.loaded=true; S.slow=true; render(); } },10000);
  db.collection('sets').onSnapshot(snap=>{
    S.sets = snap.docs.map(d=>normSet({...d.data(), id:d.id}));
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.slow=false; }
    S.loaded=true; render();
  }, err=>{ clearTimeout(timer); S.loaded=true; S.slow=false; S.dbErr=true; render(); });
}

document.addEventListener('click', e=>{
  const g=e.target.closest('[data-g]'); if(g && !e.target.closest('#stage')){ pickSetThenPlay(g.dataset.g); return; }
  const b=e.target.closest('[data-act]'); if(!b || e.target.closest('#stage') || e.target.closest('.modal-bg')) return;
  const id=b.dataset.id, set=S.sets.find(x=>x.id===id), cls=S.classes.find(x=>x.id===id);
  switch(b.dataset.act){
    case 'newclass': openClassEditor(); break;
    case 'editclass': openClassEditor(cls); break;
    case 'cards': openCards(cls); break;
    case 'delclass': confirmBox(`Xóa lớp “${cls.name}”?`,'Xóa').then(ok=>ok&&deleteItem('classes',id)); break;
    case 'new': openEditor(); break;
    case 'backup': exportAll(); break;
    case 'demo': saveSet(demoSet()).then(ok=>ok&&toast('Đã thêm bộ mẫu')); break;
    case 'play': pickGameThenPlay(set); break;
    case 'edit': openEditor(set); break;
    case 'dup': saveSet({...JSON.parse(JSON.stringify(set)), id:uid(), title:set.title+' (bản sao)'}).then(ok=>ok&&toast('Đã nhân bản')); break;
    case 'export': exportSet(set); break;
    case 'del': confirmBox(`Xóa bộ “${set.title}”? Không thể hoàn tác.`,'Xóa').then(ok=>ok&&deleteSet(id)); break;
  }
});

/* ================= Modal helpers ================= */
function modal(html, cls=''){
  const bg=h(`<div class="modal-bg"><div class="modal ${cls}">${html}</div></div>`);
  document.body.appendChild(bg);
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) bg._close&&bg._close(); });
  bg._close=()=>bg.remove();
  return bg;
}
function confirmBox(msg, okText='Đồng ý'){
  return new Promise(res=>{
    const m=modal(`<h3>Xác nhận</h3><p>${esc(msg)}</p><div class="foot"><button data-x="0">Hủy</button><button class="primary" data-x="1">${esc(okText)}</button></div>`);
    m._close=()=>{m.remove();res(false)};
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{m.remove();res(b.dataset.x==='1')});
  });
}
function pickSetThenPlay(gid){
  if(!S.sets.length){ toast(S.canEdit?'Hãy tạo một bộ câu hỏi trước':'Chưa có bộ câu hỏi nào'); return; }
  const g=GAMES.find(x=>x.id===gid);
  const sorted=S.sets.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const m=modal(`<h3>${g.ic} ${g.name}</h3><p class="muted">Chọn bộ câu hỏi để chơi:</p>
    <div style="display:flex;flex-direction:column;gap:6px">${sorted.map(s=>`<button style="text-align:left" data-s="${s.id}"><b>${esc(s.title)}</b> <span class="muted">· ${s.questions.length} câu</span></button>`).join('')}</div>
    <div class="foot"><button data-c>Đóng</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ m.remove(); setupGame(g, S.sets.find(x=>x.id===b.dataset.s)); });
}
function pickGameThenPlay(set){
  const m=modal(`<h3>Chơi “${esc(set.title)}”</h3><p class="muted">Chọn trò chơi:</p>
    <div class="games" style="grid-template-columns:1fr 1fr">${GAMES.map(g=>`<button class="game" data-pg="${g.id}" style="box-shadow:none;border-color:var(--line)"><div class="ic" style="background:${g.bg}">${g.ic}</div><b>${g.name}</b><span>${g.desc}</span></button>`).join('')}</div>
    <div class="foot"><button data-c>Đóng</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  m.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{ m.remove(); setupGame(GAMES.find(x=>x.id===b.dataset.pg), set); });
}

/* ================= Game setup ================= */
function setupGame(g, set){
  const valid=set.questions.filter(q=>q.q.trim());
  if(!valid.length){ toast('Bộ này chưa có câu hỏi'); return; }
  let extra='';
  if(g.id==='team') extra=`<label class="f">Tên các đội (mỗi dòng một đội, 2–6 đội)</label><textarea id="sTeams" rows="4">Đội Đỏ\nĐội Xanh\nĐội Lá\nĐội Vàng</textarea>

    ${S.classes.length?`<label class="f">Lớp chơi (hiện tên học sinh${['rcv','team'].includes(g.id)?', quét thẻ trả lời':''})</label><select id="sClass"><option value="">— Không dùng danh sách lớp —</option>${S.classes.map(c=>`<option value="${c.id}" ${lastClass()===c.id?'selected':''}>${esc(c.name)} (${c.students.length} HS)</option>`).join('')}</select>`:''}
    ${showTime?`<label class="f">Thời gian mỗi câu (giây) — để trống để dùng thời gian đã đặt từng câu</label><input id="sTime" type="number" min="5" placeholder="Mặc định: ${set.time}s">`:''}
    ${extra}
    <div class="foot"><button data-c>Hủy</button><button class="gold" data-go>▶ Bắt đầu</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  const mk=m.querySelector('[data-mkclass]'); if(mk) mk.onclick=()=>{ m.remove(); openClassEditor(); };
  m.querySelector('[data-go]').onclick=()=>{
    const opt={};
    const v=id=>{const el=m.querySelector('#'+id); return el?(el.type==='checkbox'?el.checked:el.value):undefined};
    opt.shufQ=v('sShufQ'); opt.shufA=v('sShufA'); opt.time=+v('sTime')||0;
    opt.players=clamp(+v('sPlayers')||40,1,9999);
    opt.teams=(v('sTeams')||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6);
    opt.plus=+v('sPlus')||10; opt.minus=Math.abs(+v('sMinus')||0);
    opt.wheel=v('sWheel')||'q';
    const cid=v('sClass'); try{ localStorage.setItem('scot_lastclass', cid||''); }catch(_){}
    const c=cid&&S.classes.find(x=>x.id===cid); opt.cls = c && c.students.length ? normClass(JSON.parse(JSON.stringify(c))) : null;
    if(g.id==='team' && opt.teams.length<2){ toast('Cần ít nhất 2 đội'); return; }
    m.remove();
    let qs=valid.map(q=>({...q, options:q.options.slice()}));
    if(opt.shufQ) qs=shuffle(qs);
    if(opt.shufA) qs=qs.map(q=>{ if(q.type!=='mc') return q; const idx=shuffle(q.options.map((_,i)=>i).filter(i=>q.options[i].trim())); return {...q, options:idx.map(i=>q.options[i]), correct:idx.indexOf(q.correct)}; });
    openStage(g, {...set, questions:qs}, opt);
  };
}

  st.querySelector('[data-music]').onclick=e=>{ MUSIC.on=!MUSIC.on; try{localStorage.setItem('scot_music',MUSIC.on?'1':'0')}catch(_){}; e.target.textContent=MUSIC.on?'🎵 Nhạc':'🔇 Nhạc'; MUSIC.on?musicStart():musicStop(); };

  if(pk) pk.onclick=()=>{ const pool=(stagePool?stagePool():opt.cls.students.map((n,i)=>i)); if(!pool.length){ toast('Không còn học sinh nào'); return; } pickName(opt.cls, pool); };

let stagePool=null; // games may set a function returning eligible student indexes
function pickName(cls, pool){
  const box=h(`<div class="namepick"><div><small>Mời bạn</small><b>…</b><small data-n></small></div></div>`);
  document.body.appendChild(box);

function closeStage(){

function flash(text){ const f=h(`<div class="flash"><div>${esc(text)}</div></div>`); document.body.appendChild(f); setTimeout(()=>f.remove(),1900); }
function bellSVG(cls='bell'){ return `<svg class="${cls}" viewBox="0 0 64 64"><use href="#bellsym"/></svg>`; }

/* Timer */
function makeTimer(total, onEnd){
  const R=44, C=2*Math.PI*R;
  const el=h(`<div class="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.18)" stroke-width="9"/><circle class="arc" cx="50" cy="50" r="${R}" fill="none" stroke="#f2b705" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="n"></div></div>`);
  let left=total, running=false, iv=null, lastSec=null;
  const arc=el.querySelector('.arc'), n=el.querySelector('.n');
  function draw(){ const s=Math.ceil(left); n.textContent=s; arc.style.strokeDashoffset = C*(1-left/total); arc.style.stroke = left<=5?'#ff6b6b':'#f2b705'; el.classList.toggle('low', running && left<=5 && left>0); }
  const T={el, get running(){return running}, get left(){return left},
    start(){ if(running||left<=0) return; running=true; musicDuck(true); const t0=performance.now(), base=left;
      iv=setInterval(()=>{ left=Math.max(0, base-(performance.now()-t0)/1000); const s=Math.ceil(left);
        if(s!==lastSec){ lastSec=s; if(left>0 && s<=5) sfx.tick(); }
        draw(); if(left<=0){ T.stop(); sfx.timeup(); onEnd&&onEnd(); } },100); },
    stop(){ if(running) musicDuck(false); running=false; clearInterval(iv); draw(); },
    reset(t){ T.stop(); total=t||total; left=total; lastSec=null; draw(); },
    destroy(){ if(running) musicDuck(false); clearInterval(iv); }
  };
  draw(); return T;
}

/* Question view (used by several games) */
function questionView(q, label, seconds){
  const el=h(`<div class="qwrap"><div class="qtop"><span class="qnum">${esc(label)}</span><span class="grow"></span><span class="tslot"></span></div>
    <div class="qtext">${esc(q.q)}</div><div class="ans"></div><div class="explain hidden"></div></div>`);
  const ans=el.querySelector('.ans');
  if(q.type==='short'){
    ans.innerHTML=`<div class="shortbox">✍️ Viết đáp án vào bảng con</div>`;
  } else {
    const opts=q.options.map((o,i)=>({o,i})).filter(x=>x.o.trim()||q.type==='tf');
    ans.innerHTML=`<div class="opts ${opts.length<=2&&q.type==='tf'?'':''}">${opts.map(({o,i})=>`<div class="o" data-i="${i}" style="background:${q.type==='tf'?(i===0?OPTC[3]:OPTC[0]):OPTC[i]}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>`;
  }
  const timer=seconds?makeTimer(seconds):null;
  if(timer) el.querySelector('.tslot').appendChild(timer.el);
  let revealed=false;
  return { el, timer, get revealed(){return revealed},
    reveal(){ if(revealed) return; revealed=true; timer&&timer.stop();
      if(q.type==='short'){ const b=ans.querySelector('.shortbox'); b.textContent=q.answer||'(chưa nhập đáp án)'; b.classList.add('win'); }
      else ans.querySelectorAll('.o').forEach(o=>o.classList.add(+o.dataset.i===q.correct?'win':'dim'));
      if(q.explain.trim()){ const ex=el.querySelector('.explain'); ex.innerHTML='💡 '+esc(q.explain); ex.classList.remove('hidden'); }
      sfx.correct();
    },
    destroy(){ timer&&timer.destroy(); }
  };
}
function keyHandler(map){ const f=e=>{ if(e.target.matches('input,textarea,select')) return; if(document.querySelector('.scan,.scandock,.namepick,.modal-bg')) return; const fn=map[e.key]; if(fn){ e.preventDefault(); fn(); } }; document.addEventListener('keydown',f); return ()=>document.removeEventListener('keydown',f); }

/* ================= Game: Rung chuông vàng ================= */
function gameRCV(root, set, opt){
  const qs=set.questions; let idx=-1, qv=null, players=opt.players;
  const initial=opt.players;
  const cls=opt.cls, N=cls?cls.students.length:0;
  const out=new Set();            // eliminated students
  let marks=null;                 // Map idx -> {cls, letter} from the last scan
  let winnerShown=false;
  const alive=()=>{ const a=[]; for(let i=0;i<N;i++) if(!out.has(i)) a.push(i); return a; };
  if(cls) stagePool=alive;
  let unkey=()=>{};

  function intro(){
    root.innerHTML=`<div class="center">${bellSVG('bell ring')}<div class="big">RUNG CHUÔNG VÀNG</div><div style="font-size:22px;opacity:.85">${esc(set.title)} · ${qs.length} câu hỏi${cls?` · ${N} thí sinh lớp ${esc(cls.name)}`:''}</div>
      ${pairCardHTML()}
      <div class="ctrl"><button class="st gold" data-start>▶ Bắt đầu</button></div><div class="muted" style="color:#c9d3f0;font-size:14px">Phím tắt: Space = bắt đầu/dừng giờ · Enter = đáp án / câu tiếp · ← → = chuyển câu</div></div>`;
    root.querySelector('[data-start]').onclick=()=>{ sfx.bell(); go(0); };
    fillPairCard(root.querySelector('.paircard'), cls);
    unkey(); unkey=keyHandler({'Enter':()=>go(0),' ':()=>go(0)});
  }
  const dying=new Set();
  function floorEl(){
    const el=h(`<div class="floor"><div class="fh">🏟 Sàn thi đấu <span class="grow"></span>Còn <b></b>/${N}</div><div class="chips"></div>
      <div class="row" style="font-size:12px;gap:6px"><span style="opacity:.6" class="grow">Chạm vào tên để loại</span><button class="sm" data-outs style="background:rgba(255,255,255,.14);color:#fff;padding:4px 8px">Đã loại: <b>0</b></button></div></div>`);
    el.querySelector('.chips').onclick=e=>{ const c=e.target.closest('.chip'); if(!c) return; const i=+c.dataset.i; if(out.has(i)||dying.has(i)) return; eliminate([i], false); };
    el.querySelector('[data-outs]').onclick=showOuts;
    return el;
  }
  function drawFloor(){
    const f=root.querySelector('.floor'); if(!f) return;
    const shown=cls.students.map((n,i)=>i).filter(i=>!out.has(i));
    f.querySelector('.fh b').textContent=alive().length;
    f.querySelector('[data-outs] b').textContent=out.size;
    const ch=f.querySelector('.chips');
    ch.classList.toggle('big', shown.length<=16); ch.classList.toggle('huge', shown.length<=6);
    ch.innerHTML=shown.map(i=>{ const n=cls.students[i], m=marks&&marks.get(i), d=dying.has(i);
      return `<div class="chip ${d?'dying':''} ${!d&&m?m.cls:''}" data-i="${i}" title="${esc(n)}"><i>${i+1}</i><span>${esc(shortName(n))}</span>${!d&&m&&m.letter?`<span class="bd">${m.letter}</span>`:''}</div>`; }).join('');
  }
  // wrong students: name turns red, then vanishes from the floor
  function eliminate(list, announce){
    list=list.filter(i=>!out.has(i)&&!dying.has(i)); if(!list.length) return;
    list.forEach(i=>dying.add(i)); drawFloor(); sfx.wrong();
    setTimeout(()=>{ list.forEach(i=>{ const c=root.querySelector(`.floor .chip[data-i="${i}"]`); if(c) c.classList.add('vanish'); }); }, 1800);
    setTimeout(()=>{ list.forEach(i=>{ dying.delete(i); out.add(i); }); drawFloor(); if(announce) flash(`Loại ${list.length} thí sinh`); checkWinner(); }, 2500);
  }
  function showOuts(){
    const ids=[...out].sort((a,b)=>a-b);
    const m=modal(`<h3>Học sinh đã bị loại (${ids.length})</h3>${ids.length?'<p class="muted">Bấm vào tên để đưa bạn đó trở lại sàn thi đấu.</p>':'<p class="muted">Chưa có ai bị loại.</p>'}
      <div style="display:flex;flex-wrap:wrap;gap:6px">${ids.map(i=>`<button class="sm" data-back="${i}">${i+1}. ${esc(cls.students[i])}</button>`).join('')}</div>
      <div class="foot"><button class="primary" data-c>Đóng</button></div>`);
    m.querySelector('[data-c]').onclick=()=>m.remove();
    m.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ out.delete(+b.dataset.back); b.remove(); if(alive().length>1) winnerShown=false; drawFloor(); });
  }
  function checkWinner(){
    if(!cls || winnerShown) return;
    const a=alive(); if(a.length===1){ winnerShown=true; setTimeout(()=>winner(a[0]),1300); }
  }
  function winner(i){
    qv&&qv.timer&&qv.timer.stop(); sfx.bell();
    const ov=h(`<div class="center" style="position:absolute;inset:0;top:52px;z-index:15;background:radial-gradient(ellipse at center,#2b4fb0 0%,#0f1e4a 75%)">${bellSVG('bell ring')}
      <div style="font-size:clamp(20px,2.4vw,30px);font-weight:700;color:var(--gold)">NGƯỜI RUNG CHUÔNG VÀNG</div>
      <div class="big">${esc(cls.students[i])}</div><div style="opacity:.8;font-size:18px">Thẻ số ${i+1} · trụ lại đến câu ${idx+1}/${qs.length}</div>
      <div class="ctrl"><button class="st" data-cont>Tiếp tục câu hỏi</button><button class="st gold" data-x>Về trang chính</button></div></div>`);
    $('#stage').appendChild(ov); flash('🔔 RUNG CHUÔNG VÀNG!');
    ov.querySelector('[data-cont]').onclick=()=>ov.remove();
    ov.querySelector('[data-x]').onclick=closeStage;
  }
  function go(i){
    if(i>=qs.length){ end(); return; }
    if(i<0) return;
    qv&&qv.destroy(); idx=i; marks=null; const q=qs[idx];
    qv=questionView(q, `Câu ${idx+1}/${qs.length}`, opt.time||qTime(q,set));
    root.innerHTML='';
    let counter=null;
    if(cls){ const lay=h('<div class="layout2"></div>'); lay.appendChild(qv.el); lay.appendChild(floorEl()); root.appendChild(lay); drawFloor(); }
    else {
      counter=h(`<div class="counter">Thí sinh còn lại <button data-m>−</button><b>${players}</b><button data-p>+</button></div>`);
      qv.el.querySelector('.qtop').insertBefore(counter, qv.el.querySelector('.grow'));
      counter.querySelector('[data-m]').onclick=()=>{ players=Math.max(0,players-1); counter.querySelector('b').textContent=players; };
      counter.querySelector('[data-p]').onclick=()=>{ players++; counter.querySelector('b').textContent=players; };
      root.appendChild(qv.el);
    }
    const canScan = cls && q.type!=='short';
    const ctrl=h(`<div class="ctrl"><button class="st" data-prev>‹ Câu trước</button><button class="st green" data-t>▶ Tính giờ</button>${canScan?'<button class="st" data-scan style="background:#3d6fe0">📷 Quét đáp án</button>':''}<button class="st gold" data-r>Hiện đáp án</button><button class="st" data-help>🛟 Cứu trợ</button><button class="st" data-next>Câu tiếp ›</button></div>`);
    root.appendChild(ctrl);
    const tb=ctrl.querySelector('[data-t]');
    const toggle=()=>{ if(qv.revealed) return; if(qv.timer.running){ qv.timer.stop(); tb.textContent='▶ Tiếp tục'; } else { qv.timer.start(); tb.textContent='⏸ Dừng'; } };
    tb.onclick=toggle;
    const reveal=()=>{ qv.reveal(); tb.disabled=true; };
    ctrl.querySelector('[data-r]').onclick=reveal;
    ctrl.querySelector('[data-prev]').onclick=()=>go(idx-1);
    ctrl.querySelector('[data-prev]').disabled=idx===0;
    ctrl.querySelector('[data-next]').onclick=()=>go(idx+1);
    if(canScan) ctrl.querySelector('[data-scan]').onclick=()=>scan(reveal);
    ctrl.querySelector('[data-help]').onclick=()=>{
      if(cls){ if(!out.size){ toast('Chưa có học sinh nào bị loại'); return; } out.clear(); dying.clear(); marks=null; winnerShown=false; drawFloor(); }
      else { players=initial; counter.querySelector('b').textContent=players; }
      flash('🛟 CỨU TRỢ!'); sfx.fanfare(); };
    unkey(); unkey=keyHandler({' ':toggle,'Enter':()=>qv.revealed?go(idx+1):reveal(),'ArrowRight':()=>go(idx+1),'ArrowLeft':()=>go(idx-1)});
  }
  async function scan(reveal){
    const q=qs[idx], elig=alive();
    if(!elig.length){ toast('Không còn thí sinh trên sàn'); return; }
    qv.timer&&qv.timer.stop();
    const valid=validLetters(q);
    marks=new Map(); drawFloor();
    const answers=await openScanner({cls, eligible:elig, valid, title:`Câu ${idx+1}`, onProgress:a=>{ marks=new Map(); a.forEach((v,i)=>marks.set(i,{cls:'got',letter:'✓'})); drawFloor(); }});
    if(!answers){ marks=null; drawFloor(); return; }
    const ok=[],bad=[],none=[];
    elig.forEach(i=>{ const a=answers.get(i); if(a==null) none.push(i); else if(a===q.correct) ok.push(i); else bad.push(i); });
    const nm=i=>`${i+1}. ${esc(cls.students[i])}`;
    const m=modal(`<h3>Kết quả câu ${idx+1}</h3>
      <div class="row" style="gap:18px;font-size:16px;margin:8px 0"><span style="color:var(--ok)">✓ Đúng: <b>${ok.length}</b></span><span style="color:var(--bad)">✗ Sai: <b>${bad.length}</b></span><span class="muted">Chưa quét: <b>${none.length}</b></span></div>
      ${bad.length?`<label class="f">Trả lời sai</label><div style="font-size:14px">${bad.map(i=>nm(i)+' <b>('+LETTERS[answers.get(i)]+')</b>').join(' · ')}</div>`:''}
      ${none.length?`<label class="f">Chưa quét được</label><div style="font-size:14px">${none.map(nm).join(' · ')}</div><label class="row" style="margin-top:8px"><input type="checkbox" data-none style="width:auto"> Loại cả học sinh chưa quét được</label>`:''}
      <div data-warn class="notice hidden" style="margin-top:12px">Tất cả thí sinh còn lại đều sai — theo luật, <b>không ai bị loại</b> ở câu này.</div>
      <div class="foot"><button data-only>Chỉ công bố đáp án</button><button class="primary" data-go>Công bố & loại học sinh sai</button></div>`);

function scanImage(src, sw, sh, maxSide, cv, isOk, isStu){

    const ok=isOk(mk.id), stu=isStu(mk.id);
    const c=mk.corners, side=Math.hypot(c[1][0]-c[0][0],c[1][1]-c[0][1]);

    ctx.beginPath(); c.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
    const cx=(c[0][0]+c[2][0])/2, cy=(c[0][1]+c[2][1])/2, fs=Math.max(14,side*0.42);
    const label= ok ? (cv.dataset.private ? `${mk.id+1}·${LETTERS[mk.ans]}` : `${mk.id+1} ✓`) : stu ? `${mk.id+1} (loại)` : `#${mk.id+1}?`;
    ctx.font=`800 ${fs}px "Be Vietnam Pro",sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';

/* ===== Minimal QR encoder (byte mode, error level M, versions 1–9) ===== */
const QR_SPEC=[null,
  {ec:10,b:[[1,16]],al:[]},{ec:16,b:[[1,28]],al:[6,18]},{ec:26,b:[[1,44]],al:[6,22]},{ec:18,b:[[2,32]],al:[6,26]},
  {ec:24,b:[[2,43]],al:[6,30]},{ec:16,b:[[4,27]],al:[6,34]},{ec:18,b:[[4,31]],al:[6,22,38]},
  {ec:22,b:[[2,38],[2,39]],al:[6,24,42]},{ec:22,b:[[3,36],[2,37]],al:[6,26,46]}];
const GF_EXP=new Uint8Array(512), GF_LOG=new Uint8Array(256);
(()=>{ let x=1; for(let i=0;i<255;i++){ GF_EXP[i]=x; GF_LOG[x]=i; x<<=1; if(x&256) x^=0x11D; } for(let i=255;i<512;i++) GF_EXP[i]=GF_EXP[i-255]; })();
const gfMul=(a,b)=>(a&&b)?GF_EXP[GF_LOG[a]+GF_LOG[b]]:0;
function rsEC(data, n){
  let g=[1]; for(let i=0;i<n;i++){ const ng=new Array(g.length+1).fill(0); for(let j=0;j<g.length;j++){ ng[j]^=g[j]; ng[j+1]^=gfMul(g[j],GF_EXP[i]); } g=ng; }
  const r=new Array(n).fill(0);
  for(const d of data){ const f=d^r[0]; r.shift(); r.push(0); for(let j=0;j<n;j++) r[j]^=gfMul(g[j+1],f); }
  return r;
}
function qrMatrix(text, forceVer, forceMask){
  const bytes=[...new TextEncoder().encode(text)];
  let ver=forceVer||0;
  const cap=v=>QR_SPEC[v].b.reduce((s,[n,k])=>s+n*k,0);
  if(!ver){ for(let v=1;v<=9;v++) if(4+8+bytes.length*8<=cap(v)*8){ ver=v; break; } }
  if(!ver) throw new Error('QR: text too long');
  const sp=QR_SPEC[ver], dataLen=cap(ver);
  const bits=[]; const put=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  put(4,4); put(bytes.length,8); bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,dataLen*8-bits.length)); while(bits.length%8) bits.push(0);
  const data=[]; for(let i=0;i<bits.length;i+=8){ let v=0; for(let j=0;j<8;j++) v=(v<<1)|bits[i+j]; data.push(v); }
  for(let p=0;data.length<dataLen;p++) data.push(p%2?0x11:0xEC);
  const blocks=[]; let off=0; for(const [n,k] of sp.b) for(let i=0;i<n;i++){ const d=data.slice(off,off+k); off+=k; blocks.push({d, e:rsEC(d,sp.ec)}); }
  const cw=[]; const maxK=Math.max(...blocks.map(b=>b.d.length));
  for(let i=0;i<maxK;i++) for(const b of blocks) if(i<b.d.length) cw.push(b.d[i]);
  for(let i=0;i<sp.ec;i++) for(const b of blocks) cw.push(b.e[i]);
  const N=ver*4+17, M=[...Array(N)].map(()=>new Array(N).fill(false)), F=[...Array(N)].map(()=>new Array(N).fill(false));
  const set=(x,y,v)=>{ M[y][x]=v; F[y][x]=true; };
  for(let i=0;i<N;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  const finder=(cx,cy)=>{ for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){ const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=N||y>=N) continue; const d=Math.max(Math.abs(dx),Math.abs(dy)); set(x,y,d!==2&&d!==4); } };
  finder(3,3); finder(N-4,3); finder(3,N-4);
  const al=sp.al, na=al.length;
  for(let i=0;i<na;i++)for(let j=0;j<na;j++){ if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) continue;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++) set(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }
  const drawFormat=mask=>{ const d=(0<<3)|mask; let r=d; for(let i=0;i<10;i++) r=(r<<1)^((r>>9)*0x537); const b=((d<<10)|r)^0x5412; const g=i=>((b>>i)&1)===1;
    for(let i=0;i<=5;i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9;i<15;i++) set(14-i,8,g(i));
    for(let i=0;i<8;i++) set(N-1-i,8,g(i)); for(let i=8;i<15;i++) set(8,N-15+i,g(i)); set(8,N-8,true); };
  drawFormat(0);
  if(ver>=7){ let r=ver; for(let i=0;i<12;i++) r=(r<<1)^((r>>11)*0x1F25); const b=(ver<<12)|r;
    for(let i=0;i<18;i++){ const bit=((b>>i)&1)===1, a=N-11+i%3, c=Math.floor(i/3); set(a,c,bit); set(c,a,bit); } }
  let k=0; const total=cw.length*8;
  for(let right=N-1;right>=1;right-=2){ if(right===6) right=5;
    for(let v=0;v<N;v++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?N-1-v:v;
      if(!F[y][x]){ if(k<total){ M[y][x]=((cw[k>>3]>>(7-(k&7)))&1)===1; k++; } } } }
  const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const applyMask=m=>{ for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(!F[y][x]&&maskFn[m](x,y)) M[y][x]=!M[y][x]; };
  const penalty=()=>{ let p=0;
    for(let t=0;t<2;t++) for(let a=0;a<N;a++){ let run=1; const row=[];
      for(let b=0;b<N;b++) row.push(t?M[b][a]:M[a][b]);
      for(let b=1;b<=N;b++){ if(b<N&&row[b]===row[b-1]) run++; else { if(run>=5) p+=3+run-5; run=1; } }
      const s=row.map(v=>v?1:0).join('');
      for(const pat of ['10111010000','00001011101']){ let i=s.indexOf(pat); while(i>=0){ p+=40; i=s.indexOf(pat,i+1); } } }
    for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){ const c=M[y][x]; if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1]) p+=3; }
    let dark=0; for(const r of M) for(const v of r) if(v) dark++;
    p+=Math.floor(Math.abs(dark*100/(N*N)-50)/5)*10; return p; };
  let best=forceMask;
  if(best==null){ let bp=Infinity; for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const pp=penalty(); if(pp<bp){bp=pp;best=m;} applyMask(m); } }
  applyMask(best); drawFormat(best);
  return M;
}
function qrSVG(text, px){
  const M=qrMatrix(text), N=M.length, q=4; let d='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(M[y][x]) d+=`M${x+q} ${y+q}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N+2*q} ${N+2*q}" width="${px||240}" height="${px||240}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

    <ol style="line-height:1.9;padding-left:1.3em">
      <li>Trên điện thoại, mở <b>Chrome</b> (Android) hoặc <b>Safari</b> (iPhone).</li>
      <li>Vào <b>claude.ai</b> → <b>Đăng nhập</b> bằng <b>đúng tài khoản</b> đang mở app trên máy tính.</li>
      <li>Xong. Trình duyệt sẽ <b>nhớ đăng nhập</b> — từ lần sau chỉ cần mở Camera quét mã QR trên màn chiếu là điện thoại tự nối.</li>

    <div class="notice"><b>Mẹo:</b> sau khi nối lần đầu, trên điện thoại chọn <b>Thêm vào màn hình chính</b> (Chrome: ⋮ → Thêm vào màn hình chính · Safari: nút Chia sẻ → Thêm vào MH chính). Biểu tượng đó mở thẳng app — bấm nút vàng <b>📱 Nối lại máy chiếu</b> là nối ngay, không cần quét lại QR.</div>
    <p class="muted" style="font-size:13px">Vì sao cần đăng nhập? App nằm trên tài khoản Claude của bạn; chỉ máy đã đăng nhập tài khoản này mới nhận được danh sách và kết quả của lớp — người lạ không thể xem.</p>

function pairCardHTML(){
  return `<div class="paircard"><div class="qrbox" data-qrslot-intro><div style="width:150px;height:150px;display:grid;place-items:center;color:#888;font-size:13px;line-height:1.3">Đang tạo<br>mã QR…</div></div>
    <div><b style="font-size:18px">📱 Nối điện thoại để chụp đáp án</b><div data-pairbody style="font-size:14px;opacity:.92;margin:4px 0">Đang chuẩn bị kết nối…</div><div data-phonestat style="font-weight:700"></div></div></div>`;
}
function pairBlockReason(cls){
  if(!window.claude || !window.claude.use || location.protocol==='file:')
    return `Bạn đang mở <b>bản tải về</b> trên máy. Kết nối điện thoại bằng mã QR chỉ dùng được khi mở app bằng <b>link claude.ai</b>:<br><span style="color:var(--gold);word-break:break-all">${APP_URL}</span>`;
  if(!cls) return `Chưa chọn <b>lớp</b> cho trận này. Bấm <b>✕ Thoát</b>, tạo lớp ở trang chính (mục <b>Lớp học & thẻ trả lời</b>) rồi chọn lớp ở ô <b>“Lớp chơi”</b> khi bắt đầu trò chơi.`;
  if(!S.canEdit) return 'Chỉ giáo viên (chủ app, đã đăng nhập) mới kết nối được điện thoại.';
  return '';
}
async function waitRoom(ms){ const t0=Date.now(); while(!S.roomTried && Date.now()-t0<ms) await new Promise(r=>setTimeout(r,200)); return S.room; }
async function fillPairCard(card, cls){
  if(!card) return; const body=card.querySelector('[data-pairbody]'), slot=card.querySelector('[data-qrslot-intro]');
  const fail=html=>{ body.innerHTML=html; slot.innerHTML='<div style="width:150px;height:150px;display:grid;place-items:center;font-size:44px">📵</div>'; card.style.borderColor='rgba(255,120,120,.8)'; };
  let why=pairBlockReason(cls); if(why) return fail(why);
  await waitRoom(10000);
  if(!S.room) return fail('Chưa mở được kết nối trực tiếp. Hãy tải lại trang (Ctrl + F5) rồi thử lại.');
  try{ await ensurePair(); }catch(e){ return fail('Không tạo được mã kết nối lúc này. Hãy tải lại trang rồi thử lại.'); }
  if(!card.isConnected) return;
  slot.innerHTML=pairQR(150);
  body.innerHTML=`Mở <b>Camera</b> điện thoại → hướng vào mã → chạm vào liên kết hiện ra. Điện thoại tự nối, không cần nhập gì.<br>Mã cố định <b style="color:var(--gold);font-size:20px;letter-spacing:2px">${R.code}</b> · <a href="#" data-firsttime style="color:#9fd0ff">Lần đầu dùng điện thoại?</a>`;
  const ft=body.querySelector('[data-firsttime]'); if(ft) ft.onclick=e=>{ e.preventDefault(); firstTimeHelp(); };
  updatePairUI();
}
function pairQR(px){ try{ return qrSVG(APP_URL+'#pair-'+R.code, px); }catch(e){ return ''; } }
function updatePairUI(){
  document.querySelectorAll('[data-qrslot]').forEach(el=>{
    if(R.phones || !R.code){ el.classList.add('hidden'); return; }
    if(el.dataset.code!==R.code){ el.dataset.code=R.code; el.innerHTML=`${pairQR(+el.dataset.qrsize||90)}<div>Quét bằng <b>Camera</b><br>điện thoại để nối<br><span style="color:#2b59c3;font-size:16px;letter-spacing:2px">Mã ${R.code}</span></div>`; }
    el.classList.remove('hidden'); });
  document.querySelectorAll('[data-phonestat]').forEach(el=>{ el.textContent = R.netDown ? '📡 Mất kết nối — đang nối lại…' : R.phones ? `📱 Đã kết nối ${R.phones} điện thoại` : '📱 Chưa có điện thoại nào kết nối'; el.style.color = R.netDown ? '#ff8a8a' : R.phones ? '#2ee66b' : ''; });
}

  if(!phoneLinkAvailable()){ const why=pairBlockReason(null)||'Kết nối điện thoại chỉ dùng được trên link claude.ai, khi đã đăng nhập.'; const mm=modal(`<h3>📱 Kết nối điện thoại</h3><p>${why}</p><div class="foot"><button class="primary" data-c>Đóng</button></div>`); mm.querySelector('[data-c]').onclick=()=>mm.remove(); return; }
  const m=modal(`<h3>📱 Kết nối điện thoại để chụp đáp án</h3><div data-body class="muted">Đang tạo mã kết nối…</div><div class="foot"><button class="primary" data-c>Đóng</button></div>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  try{
    await ensurePair();
    let qr=''; try{ qr=qrSVG(APP_URL+'#pair-'+R.code, 230); }catch(e){}
    m.querySelector('[data-body]').innerHTML=`<div class="row" style="align-items:flex-start;gap:18px;color:var(--ink)">
      ${qr?`<div style="text-align:center"><div style="border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff;line-height:0">${qr}</div><div class="muted" style="font-size:12px;margin-top:4px">Mã cố định — dùng được mọi buổi học</div></div>`:''}
      <div class="grow" style="min-width:220px"><b>Quét mã QR (khuyên dùng)</b>
        <ol style="line-height:1.7;padding-left:1.3em;margin:4px 0 10px"><li>Mở ứng dụng <b>Camera</b> của điện thoại (iPhone, Android) hoặc <b>Google Lens</b>.</li><li>Hướng vào mã bên cạnh → chạm liên kết hiện ra. Điện thoại tự nối.</li><li>Nếu quét bằng <b>Zalo</b>: chạm <b>⋯</b> → <b>Mở bằng trình duyệt</b> (Zalo không giữ đăng nhập).</li></ol>
        <div class="notice" style="margin:0 0 10px">Lần đầu: điện thoại cần đăng nhập Claude <b>một lần</b> trong Chrome/Safari. <a href="#" data-firsttime>Xem hướng dẫn</a></div>
        <b>Hoặc nhập mã</b><div style="margin:4px 0">Mở link app trên điện thoại → <b>📱 Điện thoại chụp đáp án</b> → nhập mã <span style="font-size:30px;font-weight:800;letter-spacing:6px;color:var(--brand);vertical-align:middle">${R.code}</span></div></div></div>
      <div data-phonestat style="font-weight:700;margin-top:6px"></div>
      <p class="muted" style="font-size:13px">Sau khi kết nối: mỗi khi bấm <b>📷 Quét đáp án</b> trên máy tính (hoặc bấm <b>Mở quét</b> trên điện thoại), điện thoại hiện nút chụp ảnh. Ảnh được nhận diện ngay trên điện thoại, kết quả gửi thẳng lên màn hình chiếu.</p>`;
    const ft2=m.querySelector('[data-firsttime]'); if(ft2) ft2.onclick=e=>{ e.preventDefault(); firstTimeHelp(); };
    updatePairUI();
  }catch(e){ m.querySelector('[data-body]').textContent='Không tạo được kết nối lúc này. Hãy tải lại trang rồi thử lại.'; }
